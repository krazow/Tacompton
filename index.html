// ---------------- title screen ----------------
// Phone-first: an install bar (41-install.js, when installing makes sense), the art with the ⚙️ gear, the title, ONE big button
// (Start, or Continue when there's a save), "What's the game about?" (intro + bullets, folded), then the other buttons in a
// two-column grid (an odd one out spans both columns) and the version note. fitTitle() shrinks the art when the screen is short.
function titleScreen(){clearTiles();
  const prev=document.querySelector('.title details.about'),wasOpen=prev?prev.open:null;
  const d=loadSave(),multi=[2,3].some(k=>k<=GAME.slots&&k!==curSlot()&&rawSave(k));
  const cells=[
    ...(d?['<button class="ghost" onclick="startNewGame()">🆕 New game</button>']:[]),
    ...(GAME.slots>1?['<button class="ghost" onclick="slotsModal()">💾 Save slots</button>']:[]),
    ...(installButton()?[installButton()]:[]),
    ...(typeof helpModal==='function'?['<button class="ghost" onclick="helpModal()">❓ Help!</button>']:[]),
    ...(typeof feedbackModal==='function'?['<button class="ghost" onclick="feedbackModal()">💬 Send feedback</button>']:[]),
    ...(typeof whatsNewModal==='function'?['<button id="whatsNewBtn" class="ghost" onclick="whatsNewModal()">🆕 What’s new</button>']:[]),
    '<button class="ghost" onclick="openTransfer()" title="Transfer a saved game to another device or browser">🔁 Transfer a save</button>'];
  if(cells.length%2)cells[cells.length-1]=cells[cells.length-1].replace('class="ghost"','class="ghost wide"').replace('🔁 Transfer a save<','🔁 Transfer a saved game<');
  const about=TITLE.intro||TITLE.bullets.length;
  app.innerHTML=withName(`<div class="title">${typeof installBar==='function'?installBar():''}<div class="art"><button class="tgear" onclick="openSettings()" aria-label="Settings">⚙️</button>${TITLE.art()}</div>
  <div class="body"><h1>${esc(GAME.title)}<span>${esc(GAME.tagline)}</span></h1>
  ${d?`<button class="big" onclick="resumeGame()">Continue as ${esc(d.S.name||currentName())}: ${dayName(d.S.cur)} ${fmt(d.S.t)}${multi||curSlot()>1?` (slot ${curSlot()})`:''}</button>`:`<button class="big" onclick="startNewGame()">${TITLE.start}</button>`}
  ${about?`<details class="about"><summary>What’s the game about?</summary>${TITLE.intro?`<p>${TITLE.intro}</p>`:''}
  ${TITLE.bullets.length?`<ul>${TITLE.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`:''}</details>`:''}
  <div class="tgrid">${cells.join('')}</div>
  ${saveNotice?`<div class="hint">⚠️ ${saveNotice}</div>`:''}${exitNotice?`<div class="hint">${exitNotice}</div>`:''}
  <div class="small-note">Version ${APP_VERSION}. ${TITLE.note||''}</div></div></div>`);
  exitNotice='';saveNotice='';
  const det=document.querySelector('.title details.about');
  // folded for returning players; a brand-new player sees it open only when everything still fits with the full picture
  if(det){if(wasOpen!=null)det.open=wasOpen;else if(!d&&!anySave()){det.open=true;if(!titleFits(250))det.open=false}}
  fitTitle();
  if(typeof maybeUpdateNotice==='function')maybeUpdateNotice();
}
function anySave(){for(let k=1;k<=GAME.slots;k++)if(rawSave(k))return true;return false}
const TITLE_ART_MIN=120,TITLE_ART_MAX=250;
// Does the title screen fit the window with the art at this height?

// ---- ⌨️ keyboard shortcuts (desktop) ----
// 1–9 press the numbered buttons (in a pop-up, its buttons; otherwise the action buttons on screen),
// a tab's first letter switches to it (H Here, T To-do, L Log…), Esc closes, ? lists all of this.
// Number hints only show on a computer with a mouse (CSS: hover + fine pointer), and never while typing.
const KEY_CLOSE=/^(never mind|close|cancel|not now|ok|got it|back|keep playing|keep it)\b/i;
const keyTabs=()=>{const m={};allTabs().forEach(([k,,l])=>{const c=l[0].toLowerCase();if(!m[c])m[c]=k});return m};
const keyVisible=el=>!!el&&!el.disabled&&el.offsetParent!==null&&el.getClientRects().length>0;
function keyTargets(){
  const mb=document.getElementById('mbg');
  if(mb) return {where:'modal',list:[...mb.querySelectorAll('.modal > button.act')].filter(keyVisible)};
  if(document.querySelector('.cross'))return {where:'none',list:[]};
  if(typeof S==='undefined'||!S||S.over||!document.querySelector('#app .hud'))return {where:'none',list:[]};
  return {where:'main',list:tab==='act'?[...document.querySelectorAll('#app .content button.act')].filter(keyVisible):[]}}
function keyHints(){try{
  document.querySelectorAll('.kn').forEach(n=>n.remove());
  const {list}=keyTargets();list.slice(0,9).forEach((b,i)=>{const n=document.createElement('i');n.className='kn';n.setAttribute('aria-hidden','true');n.textContent=i+1;b.appendChild(n)})}catch(e){}}
function keysModal(back){
  const row=(k,t)=>`<div class="keys-row"><kbd>${k}</kbd><span>${t}</span></div>`;
  const tabs=Object.entries(keyTabs());
  modal('⌨️ Keyboard shortcuts',`<div class="keys">${[
    row('1 – 9','Press the numbered button (the small number on its right)'),
    row(tabs.map(([c])=>c.toUpperCase()).join(' '),tabs.map(([,k])=>allTabs().find(t=>t[0]===k)[2]).join(', ')+' tabs'),
    row('Esc','Close the pop-up; skip a transition'),
    row('Enter','Press the highlighted button'),
    row('?','This list')].join('')}</div><p style="font-size:12px;color:var(--mute)">Shortcuts never fire while you’re typing.</p>`,
    (back?[{l:'Back to settings',fn:back}]:[]).concat([{l:'Close',fn:()=>{}}]))}
window.keysModal=keysModal;
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||e.repeat)return;
  const t=e.target;if(t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable))return;
  const k=e.key,lk=k.length===1?k.toLowerCase():k;
  if(k==='?'){e.preventDefault();if(!document.getElementById('mbg'))keysModal();return}
  const {where,list}=keyTargets();
  if(/^[1-9]$/.test(k)){const b=list[+k-1];if(b){e.preventDefault();b.click()}return}
  if(where==='modal'){
    if(k==='Escape'){e.preventDefault();escModal()}
    return}
  if(where!=='main')return;
  const kt=keyTabs();if(kt[lk]){e.preventDefault();setTab(kt[lk])}
});
// refresh the hints whenever the screen or a pop-up changes
{let q=false;const go=()=>{q=false;keyHints()};
  try{new MutationObserver(ms=>{if(q)return;if(ms.some(m=>[...m.addedNodes].some(n=>n.nodeType===1&&!n.classList.contains('kn'))||[...m.removedNodes].some(n=>n.nodeType===1&&n.id==='mbg'))){q=true;requestAnimationFrame(go)}})
    .observe(document.body,{childList:true,subtree:true})}catch(e){}}

  return {
    money:1500,rep:50,energy:90,boat:85,cites:0,warns:0,
    fuel:20,                 // gallons in the boat's tank (TANK = 40)
    gear:3,                  // trips' worth of tackle: herring hooks, flashers, hoochies, leaders
    bait:0,                  // trays of herring on ice (1 per trip)
    baitDay:-1,              // WORLD: day index the newest tray was bought (TRIPS spoils trays at the end of baitDay+1)
    book:[],nextId:1,
    reqs:[],                 // booking requests waiting: {id, r:{...}, exp:dayIndex}
    trip:null,               // TRIPS owns its shape
    reviews:[],
    dil:{},
    unlogged:0,
    licensed:{guide:true,boat:true,crc:true},
    stats:{trips:0,clients:0,fish:0,chinook:0,coho:0,earned:0,spent:0,tips:0,viol:0,fines:0,noshow:0,fuelGal:0,seen:{},
      tolls:0,walks:0,bar:0}, // WORLD adds: tolls paid ($), Ruston Way walks, bar evenings
    visited:{home:true},
    water:{},                // TRIPS: per-day spot conditions
    // ---- WORLD's own per-day trackers (day index → value) ----
    scout:-1,                // day index whose water read is improved (scouting the Slag Pile today sets it to tomorrow)
    diner:{},coffee:{},walk:{},pier:{},bar:{},museum:{},meet:{},urgent:{},
  };
}

const SCENE={sun:[370,1220],skyDay:['#93bcd6','#e4edf0'],skyDusk:['#5f6596','#f3b68a'],skyNight:['#0b1828','#1d3047'],ground:'#5c7d52',groundNight:'#1c2a22'};
const TC={
  sea:n=>n?'#162f43':'#3f7f9e',sea2:n=>n?'#24465c':'#7fb6cc',fir:n=>n?'#0f2219':'#24513a',fir2:n=>n?'#14291f':'#2f6247',

};

// Mount Rainier: base at y, centered on x, scaled by s
const rainier=(n,x=340,s=1,y=118)=>`<g transform="translate(${x},${y}) scale(${s})"><polygon points="-130,0 -70,-40 -45,-62 -18,-80 0,-86 20,-80 48,-60 80,-36 130,0" fill="${TC.mtn(n)}"/>

const hills=(n,y=118)=>`<path d="M0 ${y-14} Q60 ${y-26} 130 ${y-12} T260 ${y-10} T400 ${y-16} T480 ${y-8} L480 ${y} L0 ${y} Z" fill="${TC.hill(n)}"/>`;

const fir=(x,h,n,c,b=140)=>{const w=h*.3;return `<g fill="${c||TC.fir(n)}"><polygon points="${x-w},${b} ${x},${b-h*.55} ${x+w},${b}"/><polygon points="${x-w*.8},${b-h*.3} ${x},${b-h*.8} ${x+w*.8},${b-h*.3}"/><polygon points="${x-w*.55},${b-h*.6} ${x},${b-h} ${x+w*.55},${b-h*.6}"/></g>`};
const firs=(xs,n,b=140)=>xs.map((x,i)=>fir(x,30+((x*7)%24),n,i%2?TC.fir2(n):TC.fir(n),b)).join('');

// the twin Tacoma Narrows bridges: towers at x1, x2; deck at y
function narrows(n,o={}){
  const x1=o.x1||150,x2=o.x2||330,top=o.top||46,deck=o.deck||96,base=o.base||118,sag=deck-14,c=n?'#4a5a66':'#7d8f99',cab=n?'#5d6d78':'#56656e';
  const ctrl=2*sag-top,mid=(x1+x2)/2,hy=x=>{const t=(x-x1)/(x2-x1);return (1-t)*(1-t)*top+2*(1-t)*t*ctrl+t*t*top};
  let hang='';for(let x=x1+12;x<x2;x+=14)hang+=`M${x} ${hy(x).toFixed(1)} V${deck}`;
  for(let x=x1-14;x>0;x-=14)hang+=`M${x} ${(top+(deck-top)*(x1-x)/x1).toFixed(1)} V${deck}`;
  for(let x=x2+14;x<480;x+=14)hang+=`M${x} ${(top+(deck-top)*(x-x2)/(480-x2)).toFixed(1)} V${deck}`;
  return `<g><rect x="0" y="${deck}" width="480" height="4" fill="${c}"/><rect x="0" y="${deck+6}" width="480" height="3" fill="${c}" opacity=".7"/>
  ${[x1,x2].map(x=>`<rect x="${x-4}" y="${top}" width="8" height="${base-top}" fill="${c}"/><rect x="${x-6}" y="${top+12}" width="12" height="3" fill="${c}"/><rect x="${x-6}" y="${top+30}" width="12" height="3" fill="${c}"/>`).join('')}
  <path d="M0 ${deck} L${x1} ${top} Q${mid} ${ctrl} ${x2} ${top} L480 ${deck}" stroke="${cab}" stroke-width="2" fill="none"/><path d="${hang}" stroke="${cab}" stroke-width=".8"/>
  ${n?Array.from({length:16},(_,i)=>`<circle cx="${15+i*30}" cy="${deck-1}" r="1.3" fill="#f7d77a"/>`).join('')+[x1,x2].map(x=>`<circle cx="${x}" cy="${top-2}" r="2" fill="#ff4a3a"/>`).join(''):''}</g>`;
}

// Minutes between places by truck (symmetric). GAME.travelAnim (20) or more plays the full-screen transition.
const TRAVEL={'home|downtown':8,'home|marina':15,'home|ruston':12,'home|foss':10,'home|gigharbor':22,
  'downtown|marina':15,'downtown|ruston':10,'downtown|foss':8,'downtown|gigharbor':22,
  'marina|ruston':8,'marina|foss':18,'marina|gigharbor':18,
  'ruston|foss':12,'ruston|gigharbor':22,'foss|gigharbor':25};
function travelMins(a,b){return TRAVEL[a+'|'+b]??TRAVEL[b+'|'+a]??15}
// The Narrows Bridge toll: eastbound only, so leaving Gig Harbor for anywhere in Tacoma costs TOLL.
function tollFor(from,to){return from==='gigharbor'&&to!=='gigharbor'?TOLL:0}
// STORY's onArrive(dest,from) calls this. It charges the toll (if any), logs it and returns what it charged.
function payToll(from,to){
  const t=tollFor(from,to);if(!t) return 0;
  spend(t);S.stats.tolls=(S.stats.tolls||0)+t;
  say(`🌉 ${$(t)} toll on the Narrows Bridge, eastbound. ${pick(['Galloping Gertie never charged a toll. Look how that went.','The Good To Go pass beeps. Your wallet sighs.','Free going out, five bucks coming home. Tacoma’s way of saying “welcome back.”'])}`);
  return t;
}

function statusTags(){
  const t=[],d=day(),trips=todaysTrips(d);
  if(trips.length) t.push(`<span class="tag">🛶 ${trips.map(b=>fmt(b.start)).join(', ')}</span>`);
  if(S.boat<=40) t.push(`<span class="tag ${S.boat<=20?'bad':''}">🔧 boat ${S.boat}</span>`);
  t.push(`<span class="tag ${S.gear<1?'bad':''}">🪝 tackle ×${S.gear}</span>`);
  if(S.bait) t.push(`<span class="tag">🐟 herring ×${S.bait}</span>`);
  t.push(`<span class="tag ${S.fuel<10?'bad':''}">⛽ ${Math.round(S.fuel)}/${TANK} gal</span>`);
  if(S.unlogged) t.push(`<span class="tag bad">📓 ${S.unlogged} catch record${S.unlogged>1?'s':''} to fill in</span>`);
  if(S.scout===d) t.push('<span class="tag">🔭 you scouted the Slag Pile</span>');
  if(S.energy<25) t.push('<span class="tag bad">🥱 running on fumes</span>');
  if(S.loc==='gigharbor') t.push(`<span class="tag">🌉 ${$(TOLL)} toll back to Tacoma</span>`);
  return t;
}
function alertBar(){
  const d=day(),m=tod(),trips=todaysTrips(d);
  for(const b of trips){
    if(m>b.start&&m<=b.start+90&&S.loc!=='marina') return {t:`⏰ Your party is waiting at Point Defiance Marina (the trip was ${fmt(b.start)}).`};
    if(m>=b.start-150&&m<=b.start&&S.loc!=='marina') return {t:`🛶 Trip today at ${fmt(b.start)} from Point Defiance Marina: ${travelMins(S.loc,'marina')} min away.`,kind:'info'};
  }
  const soon=trips.length||todaysTrips(d+1).length;
  if(soon&&S.fuel<10) return {t:`⛽ Only ${Math.round(S.fuel)} gallons in the tank. A trip burns most of that. Fuel up at the Point Defiance fuel dock.`};
  if(soon&&S.gear<1) return {t:'🪝 Out of tackle. Restock at the tackle shop downtown before your next trip.'};
  if(S.boat>0&&S.boat<=20&&soon) return {t:`🔧 The boat is at ${S.boat}. Breakdowns get likely. The marine repair shop is in Gig Harbor.`,kind:'info'};
  return null;
}

// ---- dates and small helpers (prefixed st/ST_ so they never clash with WORLD or TRIPS) ----
const ST_MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function stDate(d){const x=new Date(Date.UTC(2026,7,3+d));return `${ST_MON[x.getUTCMonth()]} ${x.getUTCDate()}`}   // day 0 = Aug 3
function stLong(d){return `${dayName(d)}, ${stDate(d)}`}
function stTrips(d){return (S.book||[]).filter(b=>b.day===d&&b.status!=='cancelled')}
function stOpen(d){return stTrips(d).filter(b=>b.status==='booked')}
function stTripType(b){
  const T=(typeof TRIPS!=='undefined'&&TRIPS&&TRIPS[b.type])||(typeof TRIP_TYPES!=='undefined'&&TRIP_TYPES&&TRIP_TYPES[b.type])||null;
  const n=T?(T.n||T.name||b.type):String(b.type||'salmon');
  return {ic:(T&&T.ic)||'🎣',n:n.charAt(0).toUpperCase()+n.slice(1)};
}
function stTripLine(b){const T=stTripType(b),p=b.party||{};return `${T.ic} ${T.n} at ${fmt(b.start||0)}${p.name?` (${p.name}${p.n?`, ${p.n}`:''})`:''}`}
function stFuelFor(b){return typeof tripFuel==='function'?tripFuel(b):8}           // gallons one trip burns (TRIPS may export tripFuel)
function stFuelNeed(d){return stOpen(d).reduce((a,b)=>a+stFuelFor(b),0)}
function stRating(){return typeof ratingAvg==='function'?ratingAvg():null}
function stMods(){const f=S.ev.flags.day;return f&&f.d===day()?f:null}
// Today's event effects, for TRIPS to read if it wants: {d, mood, fog, tribal, aroma, mountain, hawks}
function storyDayMods(){const f=stMods();return f?Object.assign({},f):{d:day(),mood:0}}
function stMod(k,v){const d=day();let f=S.ev.flags.day;if(!f||f.d!==d)f=S.ev.flags.day={d,mood:0};if(k==='mood')f.mood+=v;else f[k]=v}
const ST_OVERHEAD=45;   // a night of moorage, trailer parking, insurance and the phone bill (× difficulty cost)
function stOverhead(){return typeof overhead==='function'?overhead():Math.round(ST_OVERHEAD*(DF().cost||1))}

const ST_MORNING=['☀️ Clear and cool. August in the Northwest at its best.','🌫️ A marine layer sits on the Sound. It’ll burn off by ten.','🌬️ A light northerly. The bay has a chop on it.','🌤️ Haze from somebody’s wildfire over the Cascades.','🐦 The crows on your street are holding a meeting. Loudly.','☕ The coffee maker gurgles like it knows it’s August.'];
function onMorning(d){
  if(typeof tripsMorning==='function') tripsMorning(d);
  if(d===0){stWelcome();return}
  say(`${stLong(d)}, ${fmt(S.t)}. ${pick(ST_MORNING)}${Math.random()<.35?' '+pick(ST_LORE):''}`);
  const t=stOpen(d);
  if(t.length) say('🛶 Today: '+t.map(stTripLine).join(' · '));
  else say('🛶 No trips today. Restock, scout the bay from Ruston Way, or answer requests on 📅 Bookings.');
  const need=stFuelNeed(d);if(need&&S.fuel<need) say(`⛽ The boat has ${S.fuel} gallons and today needs about ${need}. Fuel dock at the marina.`);
  if(d===GAME.days-1) say('🏁 Last day of the season. Tonight you add it all up.');
}
function onNight(where,notes,d){
  if(where==='collapsed'){S.loc='home';notes.push('😵 You were up past midnight. You wake up on the couch with your rain jacket still on.')}
  const oh=stOverhead();money(-oh);S.stats.spent+=oh;notes.push(`💸 Moorage, trailer parking, insurance and the phone: ${$(oh)}.`);
  if(typeof tripsNight==='function') tripsNight(notes,d);
  if(S.trip){S.trip=null;notes.push('🛶 A trip was never finished. The party went home without paying.')}
  adj('energy',(where==='home'?60:30)/(where==='collapsed'?2:1));
  if(d+1<GAME.days){const need=stFuelNeed(d+1);if(need&&S.fuel<need)notes.push(`⛽ Tomorrow needs about ${need} gallons and the boat has ${S.fuel}. Fuel up at the marina before you launch.`)}
  if(d+1<GAME.days&&stOpen(d+1).length&&S.gear<1)notes.push('🪝 You’re out of tackle. The shop downtown opens at 6.');
  if(S.boat<=25)notes.push(`🔧 The boat is at ${S.boat}. The marine shop in Gig Harbor can fix that.`);
  if(S.energy<15)notes.push('🥱 You’re running on fumes.');
}
function onTime(min){if(min>0)adj('energy',-min/50)}
function onArrive(dest,from){
  S.visited[dest]=true;
  if(typeof payToll==='function') payToll(from,dest);   // WORLD: $5 leaving Gig Harbor, logged and added to S.stats.tolls
}
function daySummary(d){const n=(S.book||[]).filter(b=>b.day===d&&b.status==='done').length;return [`⭐ ${S.rep}`,`⚡ ${S.energy}`,`🛶 ${n} trip${n===1?'':'s'}`]}

// ---- To-do tab: {l, s, ok, fail, urgent} ----
function todoItems(){
  const d=day(),m=tod(),it=[];
  stTrips(d).forEach(b=>{const T=stTripType(b),p=b.party||{};
    it.push({l:`${T.ic} ${T.n}${p.name?`: ${p.name}`:''}`,s:`${fmt(b.start||0)}, Point Defiance Marina${p.n?` · party of ${p.n}`:''}`,ok:b.status==='done',fail:b.status==='noshow'||b.status==='cancelled',urgent:b.status==='booked'&&m>=(b.start||0)-120})});
  const open=stOpen(d),need=stFuelNeed(d)||(stOpen(d+1).length?stFuelNeed(d+1):0);
  if(need) it.push({l:'Fuel for the trips',s:`${S.fuel} of 40 gal in the tank, about ${need} needed. Marina fuel dock.`,ok:S.fuel>=need,urgent:S.fuel<need&&open.length>0});
  const trips=open.length||stOpen(d+1).length;
  if(trips){
    it.push({l:'Herring on ice',s:`${S.bait} tray${S.bait===1?'':'s'}. One per trip. Tackle shop Downtown.`,ok:S.bait>=open.length&&(open.length>0||S.bait>0),urgent:open.length>0&&S.bait<open.length});
    it.push({l:'Tackle',s:`${S.gear} trip${S.gear===1?'':'s'}’ worth of flashers, hoochies and leaders.`,ok:S.gear>=trips,urgent:S.gear<1});
  }
  it.push({l:'Logbook and catch record cards',s:S.unlogged?`${S.unlogged} to fill in at home before bed.`:'All caught up.',ok:!S.unlogged,urgent:S.unlogged>0&&m>=1200});
  it.push({l:'Keep a clean record',s:`${S.cites} citation${S.cites===1?'':'s'}, ${S.warns} warning${S.warns===1?'':'s'}. Three citations and your license is gone.`,ok:S.cites===0,urgent:S.cites>=2});
  if(S.boat<=40) it.push({l:'Get the boat looked at',s:`Condition ${S.boat}. Marine repair in Gig Harbor.`,ok:false,urgent:S.boat<=20});
  it.push({l:'Optional: see all of Tacoma',s:`${Object.keys(S.visited).length} of ${Object.keys(L).length} places.`,ok:Object.keys(L).every(k=>S.visited[k])});
  return it;
}

// ---- water: per-day spot conditions (S.water[d]) ----
// {wind kt, tides:[{m,hi,ft}], run:{k,c}, sp:{key:0..1 true quality}, rd:{key:0..1 the read you get without scouting}}
function trWater(d){
  if(!S.water) S.water={};
  if(S.water[d]) return S.water[d];
  const r=Math.random,prev=S.water[d-1];
  const wind=Math.round(3+r()*11+(r()<.15?7:0));
  const run={k:Math.round((1.05-d*.03)*100)/100,c:Math.round((.6+d*.05)*100)/100};   // kings fade through August, coho build
  const h0=((350+d*50)%745);                                                       // first high tide, ~50 min later each day
  const tides=[];for(let m=h0-372,i=0;m<1440;m+=372,i++){if(m>=0)tides.push({m,hi:(i%2)===1,ft:Math.round(((i%2)?11+r()*3:-1+r()*5)*10)/10})}
  const sp={},rd={};
  SPOT_KEYS.forEach(k=>{const s=SPOTS[k];let q=.18+r()*.6-(wind>=12?s.expo*.18:0);
    if(prev&&prev.sp&&prev.sp[k]!=null) q=prev.sp[k]*.45+q*.55;                   // the bite carries over: yesterday's read is worth something
    sp[k]=Math.round(clamp(q,.05,.95)*100)/100;rd[k]=Math.round(clamp(sp[k]+(r()-.5)*.36,.05,.95)*100)/100});
  return (S.water[d]={wind,tides,run,sp,rd});
}
const spotWord=q=>q>=.62?'Hot':q>=.46?'Good':q>=.3?'Fair':'Poor';
const spotIc=w=>({Hot:'🔥',Good:'🟢',Fair:'🟡',Poor:'⚪'})[w];

function makeParty(src){

  const P=pick(pool),n=P.n[0]+Math.floor(Math.random()*(P.n[1]-P.n[0]+1));
  return {P,party:{name:pick(P.names),n,want:pick(P.wants),mood:P.mood+(Math.random()<.2?-2:0)}};
}

// ---- booking requests ----
// S.reqs: {id, r:{day, d, start, type, party, price, who}, exp}. r.who / r.d are for the engine's morning report.
function makeReq(src,dMin){
  const d0=Math.max(day(),dMin==null?day()+1:dMin);
  for(let i=0;i<12;i++){
    const {P,party}=makeParty(src),d=d0+Math.floor(Math.random()*Math.min(5,GAME.days-d0));
    if(d>=GAME.days) return null;
    const type=Math.random()<.75?pick(P.types):pick(Object.keys(TRIPS)),T=TRIPS[type];
    if(d===day()&&T.start-WINDOW_EARLY<=tod()) continue;
    if(overlaps(d,T.start,type)) continue;
    const price=Math.round(T.pp*party.n*(src==='rich'?1.15:1));
    return {day:d,d,start:T.start,type,party,price,who:party.name};
  }
  return null;
}
function queueRequest(src,dMin){
  if(!S||day()>=GAME.days-1&&src!=='seed') return null;
  const r=makeReq(src,dMin);if(!r) return null;
  const q={id:S.nextId++,r,exp:Math.min(r.day,day()+1)};S.reqs.push(q);
  if(src!=='seed') showTile('📞','New booking request',`The ${r.who}, ${dlabel(r.day)}. See 📅 Bookings.`,'info');
  return q;
}

function addBooking(r,price){
  const b={id:S.nextId++,day:r.day,start:r.start,type:r.type,party:Object.assign({},r.party),price,status:'booked',dep:Math.round(price*DEP)};
  S.book.push(b);money(b.dep);
  return b;
}
function counterOdds(r){
  const ra=ratingAvg();let p=.5+r.party.mood*.05+(ra?(ra-3.8)*.25:0)+(S.rep-50)/200;
  p=1-(1-clamp(p,.1,.9))*(DF().rateK||1);

}
function reqOpts(q){

  return [

    {l:'Decline politely',s:'',fn:()=>say(`📞 You pass on the ${r.who}.`)},
  ];
}

const WDFW_COPS=['a WDFW Enforcement officer in a patrol boat','a WDFW officer checking boats at the Point Defiance launch','a WDFW officer with binoculars on Les Davis Pier'];

function cite(t,what,fine,minor,who){
  who=who||pick(WDFW_COPS);let line;
  if(minor&&S.warns<1){S.warns++;line=`⚠️ ${who} writes you a warning for ${what}. You get one; the next one costs money.`;showTile('⚠️','Warning',what,'warn')}
  else{fine=Math.round(fine*DF().fine*(1+DF().esc*S.cites));S.cites++;money(-fine);S.stats.fines+=fine;adj('rep',-6);
    line=`🚨 ${who.charAt(0).toUpperCase()+who.slice(1)} cites you for ${what}: <b>${$(fine)}</b>. That’s ${S.cites} of 3 citations before WDFW pulls your charter license.`;
    showTile('🚨','Citation',what,'bad')}
  if(t&&t.notes) t.notes.push(line); else say(line);
}
function violate(t,{p,fine,what,minor,who}){
  S.stats.viol++;
  const heat=Math.max(0,S.stats.viol-1)*.05;           // every rule broken this season makes the next likelier to be noticed
  if(Math.random()<Math.min(.9,p*DF().enforce+heat)){cite(t,what,fine,minor,who);return true}
  if(Math.random()<.25){adj('rep',-2);(t?t.notes:[]).push('👀 Another charter boat saw it. The Point Defiance docks talk.')}
  return false;
}

const DIL_MAX=2;

// ---- the trip ----
function tripStart(b){
  const T=TRIPS[b.type],m=tod(),late=Math.max(0,m-b.start),r=Math.random;
  if(m<b.start) pass(b.start-m);
  const t={id:b.id,late,step:0,steps:['spot'],q:0,happy:0,notes:[],x:[],lost:0,fuelx:0,exK:0,exC:0,rel:0,nofish:0,spot:null,shot:false,taught:false};
  if(late>15){t.happy-=Math.round(late/4);t.notes.push(`⏰ You rolled in ${late} minutes late. ${Nm(b)} noticed.`)}
  if(S.gear<=0){t.happy-=4;t.notes.push('🪝 You’re out of tackle. They fish with what’s left in the bottom of the box.')}
  if(T.bait&&S.bait<=0){t.happy-=3;t.notes.push('🐟 No herring on ice. Mooching without bait means jigging a Buzz Bomb instead.')}
  if(S.boatChk===day()) t.happy+=2;
  if(S.boat<50&&r()<(50-S.boat)/80*(S.boatChk===day()?.5:1)){const mm=40+Math.floor(r()*40),c=rp(60);lose(t,mm);t.happy-=10;fx(t,-c,'Roadside repair');adj('boat',6);
    t.notes.push(`🔧 The kicker quits off Owen Beach. ${mm} minutes with the cowling off and ${$(c)} in parts from your spares. Get the boat to the shop in Gig Harbor.`)}
  // the dilemmas: forced ones first (kids, closures, the party's wants), then the shuffled pool
  const want=b.type==='troll'?3:2,keys=Object.keys(DIL),ok=k=>(S.dil[k]||0)<DIL_MAX&&DIL[k].cond(b,t);
  const forced=keys.filter(k=>DIL[k].force&&DIL[k].force(b)&&ok(k)),pool=keys.filter(k=>!forced.includes(k)&&ok(k)),dl=forced.slice(0,want);
  while(dl.length<want&&pool.length) dl.push(pool.splice(Math.floor(r()*pool.length),1)[0]);
  dl.forEach(k=>{S.dil[k]=(S.dil[k]||0)+1});
  t.steps.push(...dl.sort(()=>r()-.5));
  S.stats.seen[b.type]=(S.stats.seen[b.type]||0)+1;
  S.trip=t;sfx('whoosh');tripNext();
}
function spotStep(b,t){
  const T=TRIPS[b.type],w=trWater(day());
  const keys=SPOT_KEYS.filter(k=>b.type==='coho'?SPOTS[k].c>=.6:SPOTS[k].k>=.5||k==='owen');
  return {t:`${T.ic} Where to, Captain?`,fixed:true,b:`<p>${T.long}</p><p>${Nm(b)} are aboard and the coffee is poured. Wind ${w.wind} kt. ${scouted()?'🔭 You scouted yesterday: these reads are sharp.':'🐟 Reads from the docks and the radio. Scouting the Slag Pile the day before sharpens them.'}</p>`,
    o:keys.map(k=>{const s=SPOTS[k],wd=spotWord(spotRead(k)),lean=s.k*T.k>s.c*T.c?'kings':'coho';
      return O(`${spotIc(wd)} ${s.n} · ${wd}`,`${s.sub}. Leans ${lean}.${s.calm>=.8?' Calm water.':s.calm<.4?' Rough in wind.':''}${s.fuel?` +${s.fuel} gal.`:''}`,(b,t)=>{
        t.spot=k;t.fuelx+=s.fuel;t.notes.push(`📍 ${s.n}: ${s.txt}`);S.stats.seen['spot_'+k]=true;
        if(k==='narrows'&&w.wind>=10&&Math.random()<.4){t.happy-=6;adj('boat',-3);t.notes.push('🌊 Wind against a four-knot ebb under the bridges. Everybody holds on; one rod goes over the side.');fx(t,-rp(90),'A rod and reel lost in the Narrows')}})})};
}
function tripNext(){
  const t=S.trip;if(!t) return;
  const b=bkOf(t.id);if(!b||b.status!=='booked'){S.trip=null;return}
  if(t.step>=t.steps.length) return tripEnd(b,t);
  const key=t.steps[t.step],v=key==='spot'?spotStep(b,t):DIL[key]?DIL[key].f(b,t):null;
  if(!v){t.step++;return tripNext()}
  const opts=v.o.slice();
  if(!v.fixed) for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}
  const T=TRIPS[b.type],n=t.steps.length;
  const head=`<p class="small-note" style="color:var(--mute);margin:0 0 6px">${T.ic} ${T.n} · ${nm(b)} · step ${t.step+1} of ${n}</p>`;
  const hot=v.o.some(o=>o.legal===false)&&S.stats.viol>0?`<p class="small-note" style="font-size:12.5px;color:var(--warn)">🚔 You’ve broken ${S.stats.viol===1?'a rule':S.stats.viol+' rules'} this season. WDFW knows your boat now.</p>`:'';
  modalSwap(v.t,head+v.b+hot,opts.map(o=>({l:o.l,s:o.s,legal:o.legal!==false,np:true,stay:true,fn:()=>{
    const tt=S.trip;if(!tt) return;const bb=bkOf(tt.id);if(!bb){S.trip=null;return}
    o.fn&&o.fn(bb,tt);tt.step++;tripNext()}})),true);
}
// index of the first legal button in the open modal (0 when none is flagged); for the tests and bots
window.legalBtn=()=>{const i=MB.findIndex(b=>b.legal===true&&!b.dis);return i<0?0:i};

function rollCatch(b,t){
  const T=TRIPS[b.type],w=trWater(day()),s=SPOTS[t.spot||'slag'],r=Math.random;
  let q=w.sp[t.spot||'slag']+t.q+(S.gear>0?0:-.15)+(T.bait?(S.bait>0?.05:-.18):(S.bait>0&&b.type==='troll'?.03:0))
    +Math.min(.1,S.stats.trips*.008)*(DF().craft==null?1:DF().craft)+(S.boat<40?-.08:0)+(S.energy<25?-.08:0)+(w.wind>=14?-.05:0)+(r()-.5)*.2;
  q=clamp(q,.05,1.1);
  const kW=s.k*T.k*w.run.k,cW=s.c*T.c*w.run.c,pk=kW/(kW+cW),open=chinookOpen();
  const lam=(.6+2.8*q)*Math.sqrt(T.len/300),fishers=Math.max(0,b.party.n-t.nofish);
  let K=0,C=0,rel=0,wild=0,short=0,hooked=0,limits=0;
  for(let i=0;i<fishers;i++){
    const enc=Math.max(0,Math.round(lam*(.5+r())));let k=0,c=0;
    for(let e=0;e<enc;e++){
      if(r()>.72) continue;                       // barbless: some come unbuttoned at the boat
      hooked++;
      if(r()<pk){const clip=r()<.62,size=r()<.78;
        if(open&&clip&&size&&k<KING_BAG&&k+c<BAG) k++; else {rel++;if(!clip)wild++;else if(!size)short++}}
      else{if(k+c<BAG) c++; else rel++}
    }
    K+=k;C+=c;if(k+c>=BAG) limits++;
  }
  return {q,K,C,rel:rel+t.rel,wild,short,hooked,limits,fishers};
}
function tripEnd(b,t){
  const T=TRIPS[b.type],w=trWater(day()),s=SPOTS[t.spot||'slag'],P=partyTpl(b),r=Math.random;
  const c=rollCatch(b,t);
  // fuel: run dry and TowBoatUS brings you home
  const gal=Math.round((T.fuel+t.fuelx+(r()-.3)*2)*(1+Math.max(0,w.wind-12)/40)*10)/10;let towed=false;
  if(S.fuel>=gal){S.fuel=Math.round((S.fuel-gal)*10)/10;S.stats.fuelGal=Math.round((S.stats.fuelGal+gal)*10)/10}
  else{towed=true;S.stats.fuelGal=Math.round((S.stats.fuelGal+S.fuel)*10)/10;S.fuel=0;const tw=rp(350);fx(t,-tw,'TowBoatUS tow');t.happy-=20;adj('rep',-3);lose(t,60);
    t.notes.push(`🛟 The engine coughs and quits off ${s.n}: out of gas. TowBoatUS takes an hour to get there and ${$(tw)} to drag you home. Fuel up at the dock next time.`)}
  const kept=c.K+c.C+t.exK+t.exC,frac=c.fishers?Math.min(1,(c.K+c.C)/(BAG*c.fishers)):0;
  // what they came for
  let h=51+(DF().mood||0)+b.party.mood+t.happy+frac*28+clamp((S.boat-65)/8,-3,3),good=[],bad=[];
  const wnt=b.party.want;
  if(wnt==='limit'){if(c.fishers&&c.limits>=c.fishers){h+=10;good.push('limits for everyone')}else if(frac<.5){h-=8;bad.push('the cooler was light')}}
  if(wnt==='king'){if(c.K+t.exK){h+=12;good.push('a king in the box')}else if(c.rel&&c.hooked){h-=3;bad.push('kings released, none kept')}else{h-=10;bad.push('no kings')}}
  if(wnt==='kids'){if(c.hooked>=c.fishers*2){h+=9;good.push('the kids never stopped reeling')}else{h-=6;bad.push('the kids got bored')}}
  if(wnt==='photos'){if(t.shot||s.scenic>=.8){h+=7;good.push('the photos')}else{h-=3;bad.push('nothing much to photograph')}}
  if(wnt==='calm'){if(s.calm>=.7&&w.wind<11){h+=8;good.push('glassy water')}else if(s.calm<.45||w.wind>=14){h-=10;bad.push('a rough ride')}}
  if(wnt==='learn'){if(t.taught||b.type==='mooch'){h+=t.taught?6:3;good.push('learning to mooch')}else{h-=4;bad.push('not much teaching')}}
  if(towed) bad.push('running out of gas');
  if(t.late>15) bad.push('a late start');
  h=clamp(h,0,110);
  const stars=h>=84?5:h>=69?4:h>=54?3:h>=40?2:1;
  const tip=Math.round(b.price*clamp((h-55)/120,0,.25)*(P.tipK||1));
  const refund=h<35?Math.round(b.price*.15):0,due=b.price-b.dep-refund;
  const xnet=t.x.reduce((a,[,v])=>a+v,0),xpos=t.x.reduce((a,[,v])=>a+Math.max(0,v),0),xneg=-t.x.reduce((a,[,v])=>a+Math.min(0,v),0);
  money(due+tip+xnet);
  const st=S.stats;st.trips++;st.clients+=b.party.n;st.fish+=kept;st.chinook+=c.K+t.exK;st.coho+=c.C+t.exC;st.earned+=b.price-refund;st.tips+=tip+xpos;st.spent+=xneg;
  // wear and tear
  pass(T.len+t.lost);
  adj('energy',-T.energy-Math.round(t.lost/20));
  adj('boat',-Math.round((2+r()*3)*(b.type==='troll'?1.4:1)*(DF().wear||1)));
  S.gear=Math.max(0,S.gear-1);
  if(T.bait&&S.bait>0) S.bait--; else if(b.type==='troll'&&S.bait>0) S.bait--;
  S.unlogged++;
  adj('rep',clamp(Math.round((h-55)/7),-6,6));
  b.status='done';
  // the review, in their words
  const rv=reviewOf(b,t,c,stars,good,bad);
  S.reviews.push(rv);if(S.reviews.length>200)S.reviews.splice(0,S.reviews.length-200);
  b.out={stars,fish:kept,tip,happy:Math.round(h)};
  S.trip=null;
  const line=`${c.K+t.exK} king${c.K+t.exK===1?'':'s'}, ${c.C+t.exC} coho kept${c.rel?`, ${c.rel} released`:''}${c.limits?` · ${c.limits} limit${c.limits>1?'s':''}`:''}`;
  say(`${T.ic} ${T.n} with ${nm(b)}: ${line}. Paid ${$(b.price-refund)} + ${$(tip+xpos)} in tips. ${'★'.repeat(stars)}${'☆'.repeat(5-stars)}`);
  const row=(l,v)=>`<div style="display:flex;justify-content:space-between;font-size:14px;padding:2px 0"><span>${l}</span><b>${v<0?'−':''}${$(Math.abs(v))}</b></div>`;
  const mood=h>=84?'😁 They’re already asking about next August.':h>=69?'🙂 Handshakes and fish photos at the dock.':h>=54?'😐 Polite thanks.':h>=40?'😕 They leave a little deflated.':'😠 Tight-lipped goodbyes.';
  const rel=c.wild||c.short?` <span style="font-size:13px;color:var(--mute)">(${[c.wild&&`${c.wild} wild king${c.wild>1?'s':''}`,c.short&&`${c.short} under ${MIN_KING}″`].filter(Boolean).join(', ')} released${chinookOpen()?'':'; Chinook retention is closed'})</span>`:'';
  const body=`${t.notes.map(n=>`<p style="font-size:14px;margin:4px 0">${n}</p>`).join('')}
    <p>🐟 <b>${line}</b>${rel}</p><p>${mood}</p>
    <div style="margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:8px">${row('Fare (deposit already paid)',b.price-b.dep)}${refund?row('Partial refund',-refund):''}${row('Tip',tip)}${t.x.map(([why,v])=>row(why,v)).join('')}${row('In your pocket today',due+tip+xnet)}</div>
    ${reviewHTML(rv)}<p style="font-size:12.5px;color:var(--mute)">⛽ ${towed?'Tank empty':`${gal} gal burned, ${S.fuel} left`} · 🔧 boat ${S.boat} · ⚡ ${S.energy} · 🪝 tackle ×${S.gear} · 📓 ${S.unlogged} catch record${S.unlogged>1?'s':''} to log</p>`;
  sfx(stars>=4?'good':stars<=2?'bad':'info');
  modalSwap(`⚓ Back at the dock · ${'★'.repeat(stars)}${'☆'.repeat(5-stars)}`,body,[{l:'Tie up and hose down the boat',fn:()=>{}}]);
}

// ---- reviews ----
const RV_OPEN={5:['Best day on the water we’ve ever had.','Book Captain {{name}}. Just do it.','Absolute legend of the Grit City.'],
  4:['Great trip, would go again.','Solid captain, knows the water.','A really good morning on the Sound.'],
  3:['It was fine.','Decent trip, nothing special.','Mixed bag.'],
  2:['Not what we paid for.','Disappointing.','Meh.'],1:['Save your money.','Never again.','One star is generous.']};
function reviewOf(b,t,c,stars,good,bad){
  const s=SPOTS[t.spot||'slag'],bits=[pick(RV_OPEN[stars])];
  if(good.length) bits.push(`Loved ${good.slice(0,2).join(' and ')}.`);
  if(c.K+t.exK) bits.push(pick([`Kings at ${s.n}!`,`My first Puget Sound king.`,`The king fought like a freight train.`]));
  else if(c.C+t.exC) bits.push(pick(['Silvers jumping all over.','Coho on the hoochies, so fun.','Fresh coho on the grill tonight.']));
  if(bad.length) bits.push(`${stars>=4?'Only gripe:':'Problem:'} ${bad.slice(0,2).join(', ')}.`);
  if(stars>=4&&Math.random()<.4) bits.push(pick(['The mountain was out.','We even liked the Tacoma Aroma.','Got Frisko Freeze after. Perfect day.','Saw a seal steal someone else’s fish.']));
  return {day:day(),who:b.party.name,type:b.type,stars,text:bits.join(' ')};
}
const reviewHTML=rv=>`<div class="review" style="border-left:3px solid var(--mute);padding:4px 10px;margin:8px 0"><b aria-label="${rv.stars} of 5 stars">${'★'.repeat(rv.stars)}${'☆'.repeat(5-rv.stars)}</b> <i>“${rv.text}”</i><br><span style="font-size:12.5px;color:var(--mute)">— the ${rv.who}, ${trD(rv.day)}</span></div>`;
function ratingAvg(){const r=(S&&S.reviews||[]).slice(-20);return r.length?Math.round(r.reduce((a,x)=>a+x.stars,0)/r.length*100)/100:null}

// ---- no-shows ----
function noShow(b,notes,why){
  b.status='noshow';money(-b.dep);S.stats.noshow++;adj('rep',-8);
  const l=`📵 ${why||`You never made it to ${nm(b)}’s ${TRIPS[b.type].n.toLowerCase()}.`} You refund the ${$(b.dep)} deposit. Rep −8, and they tell everyone.`;
  if(notes) notes.push(l); else say(l);
}

// ---- actions ----
function marinaActions(){
  const d=day(),m=tod(),a=[];
  if(S.trip&&bkOf(S.trip.id)) a.push({ic:'🛶',l:'Back to the trip',s:'Your party is still aboard.',cat:'trip',cls:'primary',fn:()=>tripNext()});
  else for(const b of todaysTrips(d)){
    const T=TRIPS[b.type],late=m-b.start,need=T.fuel;
    if(late>WINDOW_LATE) a.push({ic:'📵',l:`${Nm(b)} have gone home`,s:`Their ${fmt(b.start)} ${T.n.toLowerCase()}. Refund the ${$(b.dep)} deposit.`,cat:'trip',cls:'danger',fn:()=>noShow(b,null,`${Nm(b)} waited two hours and went home.`)});
    else if(m<b.start-WINDOW_EARLY) a.push({ic:T.ic,l:`${T.n}: ${nm(b)} at ${fmt(b.start)}`,s:`They arrive about ${fmt(b.start-30)}. You can launch from ${fmt(b.start-WINDOW_EARLY)}.`,cat:'trip',dis:true,fn:()=>{}});
    else a.push({ic:T.ic,l:`Launch: ${T.n} with ${nm(b)}`,cls:'primary',cat:'trip',
      s:`${b.party.n} aboard, ${fmt(b.start)}–${fmt(endOf(b))}. ${late>15?`⏰ ${late} min late. `:''}Wants ${WANTS[b.party.want]}.${S.fuel<need?` ⚠️ Only ${S.fuel} gal: you need ~${need}+.`:''}${S.gear<1?' ⚠️ No tackle.':''}${T.bait&&S.bait<1?' ⚠️ No herring.':''}`,
      fn:()=>tripStart(b)});
  }
  const fuelOpen=m>=FUEL_HRS[0]&&m<FUEL_HRS[1],room=Math.round((TANK-S.fuel)*10)/10,gp=r2(GAS*(DF().cost||1));
  const buy=g=>{g=Math.min(g,room);const c=r2(g*gp);spend(c);S.fuel=Math.round((S.fuel+g)*10)/10;pass(15);say(`⛽ ${g} gallons at ${$(gp)} a gallon: ${$(c)}. The tank shows ${S.fuel} of ${TANK}.`)};
  a.push({ic:'⛽',l:`Fill the tank — ${$(r2(room*gp))}`,s:fuelOpen?`${room} gal at ${$(gp)}/gal. Tank ${S.fuel}/${TANK}.`:`The fuel dock is open ${fmt(FUEL_HRS[0])}–${fmt(FUEL_HRS[1])}.`,cat:'work',cls:S.fuel<10&&fuelOpen?'primary':'',dis:!fuelOpen||room<1||!canAfford(r2(room*gp)),fn:()=>buy(room)});
  if(room>=10) a.push({ic:'⛽',l:`Ten gallons — ${$(r2(10*gp))}`,s:'Enough for a half-day and change.',cat:'work',dis:!fuelOpen||!canAfford(r2(10*gp)),fn:()=>buy(10)});
  if(S.boatChk!==d) a.push({ic:'🔍',l:'Check the boat',s:`20 min. Hoses, impeller, battery, bilge. Boat ${S.boat}.`,cat:'work',fn:()=>{
    S.boatChk=d;pass(20);
    if(S.boat<60&&Math.random()<.7){const c=rp(40);spend(c);adj('boat',8);say(`🔍 A cracked fuel line fitting and a weepy hose clamp. ${$(c)} of parts from the marina store and it’s fixed. Boat ${S.boat}.`)}
    else{adj('boat',2);say(pick(['🔍 Bilge dry, battery strong, impeller good. You tighten a clamp on principle.','🔍 You grease the trailer hubs, check the kicker and top off the oil. All good.','🔍 Everything checks out. A seal watches you work from the next slip.']))}}});
  return a;
}
function homeTripActions(){
  if(!S.unlogged) return [];
  return [{ic:'📓',l:`Fill in the logbook (${S.unlogged} trip${S.unlogged>1?'s':''})`,s:`${S.unlogged*15} min. Catch records, charter logbook, the eCRC upload.`,cat:'work',cls:S.unlogged>=2?'primary':'',
    fn:()=>{pass(S.unlogged*15);say(`📓 ${S.unlogged} trip${S.unlogged>1?'s':''} logged: dates, areas, species, clips. The kitchen table looks like a fisheries office.`);S.unlogged=0}}];
}

// ---- morning and night (called from STORY) ----
function tripsMorning(d){
  const seed=!S.water||!S.water[0];
  trWater(d);if(d+1<GAME.days) trWater(d+1);
  if(seed&&d===0){
    // the season's first bookings: some on the calendar before you start
    [[0,'coho'],[1,'mooch'],[2,'troll'],[4,'mooch'],[5,'troll'],[8,'coho']].forEach(([dd,type])=>{
      const T=TRIPS[type];if(overlaps(dd,T.start,type)) return;
      const {party}=makeParty(Math.random()<.2?'rich':null);
      const b={id:S.nextId++,day:dd,start:T.start,type,party,price:T.pp*party.n,status:'booked'};b.dep=Math.round(b.price*DEP);S.book.push(b)});
    queueRequest('seed',1);queueRequest('seed',2);
    return;
  }
  if(d>=GAME.days-1) return;
  const ra=ratingAvg(),p=clamp(.5*(DF().book||1)*(1+(S.rep-50)/100)+(ra?(ra-3.5)*.15:0),.15,.9);
  let n=0;for(let i=0;i<2;i++) if(Math.random()<p&&queueRequest(null)) n++;
  if(n) say(`📞 ${n} new booking request${n>1?'s':''} on 📅 Bookings.`);
}
function tripsNight(notes,d){
  // missed trips
  (S.book||[]).filter(b=>b.day===d&&b.status==='booked').forEach(b=>noShow(b,notes));
  // requests that lapsed
  const gone=(S.reqs||[]).filter(q=>q.exp<=d||q.r.day<=d);
  S.reqs=(S.reqs||[]).filter(q=>!gone.includes(q));
  gone.forEach(q=>notes.push(`📞 The ${q.r.who} didn’t hear back and booked another boat.`));
  // herring spoils at the end of the day after it was bought
  if(S.bait>0&&S.baitDay!=null&&d>=S.baitDay+1){notes.push(`🐟 ${S.bait} tray${S.bait>1?'s':''} of herring went soft. Into the crab pot it goes.`);S.bait=0}
  // the logbook
  if(S.unlogged>=2){
    if(Math.random()<Math.min(.5,.07*S.unlogged*DF().enforce)){const t={notes};cite(t,'charter logbook and catch records not filled in',200,true)}
    else notes.push(`📓 ${S.unlogged} trips not logged yet. WDFW spot-checks charter logbooks.`);
  }
  if(d===CHINOOK_LAST) notes.push('🚫 WDFW emergency rule: starting tomorrow (Aug 15), Chinook retention is closed in Marine Area 11. Coho only; release every king.');
}

// ---- views ----
const kv=(a,b)=>`<div class="kv" style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px"><span>${a}</span><b style="text-align:right">${b}</b></div>`;
function bookingsView(){
  const d=day();let h='';
  const rs=S.reqs||[];
  if(rs.length) h+=`<div class="sect">📞 Booking requests · ${rs.length} waiting</div>`+rs.map(q=>`<div class="req"><div class="rb">${reqBody(q)}</div>${reqOpts(q).map((o,k)=>`<button class="act" ${o.dis?'disabled':''} onclick="tripReq(${q.id},${k})"><span class="tx"><b>${o.l}</b>${o.s?'<span>'+o.s+'</span>':''}</span></button>`).join('')}</div>`).join('');
  const ra=ratingAvg();
  h+=`<div class="sect">📅 Schedule · ${ra?`★ ${ra.toFixed(2)} from ${Math.min(20,S.reviews.length)} reviews`:'no reviews yet'}</div>`;
  let any=false;
  for(let i=d;i<GAME.days;i++){
    const bs=(S.book||[]).filter(b=>b.day===i&&b.status!=='cancelled').sort((x,y)=>x.start-y.start);if(!bs.length) continue;any=true;
    h+=`<div class="todo"><span class="ck">${i===d?'👉':'·'}</span><div><b>${trD(i)}${i===d?' (today)':''}</b>${bs.map(b=>{const T=TRIPS[b.type];
      const st=b.status==='done'?` ✅ ${'★'.repeat(b.out?b.out.stars:0)}`:b.status==='noshow'?' 📵 missed':'';
      return `<span>${T.ic} ${fmt(b.start)} ${T.n} · the ${b.party.name} (${b.party.n}) · ${$(b.price)}${st}<br><i style="font-size:12.5px">wants ${WANTS[b.party.want]}</i></span>`}).join('')}</div></div>`;
  }
  if(!any) h+='<div class="rules">Nothing on the calendar. Requests come in each morning, and from people you meet on the pier, at the bar on the Foss and in Gig Harbor.</div>';
  const past=(S.book||[]).filter(b=>b.day<d&&b.status!=='booked').length;
  if(past) h+=`<p class="small-note" style="font-size:12.5px;color:var(--mute)">${past} earlier booking${past>1?'s':''} in the log.</p>`;
  const rv=(S.reviews||[]).slice(-5).reverse();
  if(rv.length) h+=`<div class="sect">⭐ Latest reviews</div>`+rv.map(reviewHTML).join('');
  return h;
}
function fishView(){
  const d=day(),w=trWater(d),sc=scouted(d);
  const tides=w.tides.map(x=>`${x.hi?'▲':'▼'} ${fmt(x.m)} ${x.ft.toFixed(1)}′`).join(' · ');
  let h=`<div class="sect">🌊 Marine Area 11 · ${trD(d)}</div>`+kv('Wind',`${w.wind} kt${w.wind>=14?' · choppy, stay tucked in':w.wind<=6?' · flat calm':''}`)+kv('Tides (Tacoma)',tides)+
    kv('Run',`Kings ${w.run.k>=.9?'strong':w.run.k>=.75?'steady':'thinning'} · coho ${w.run.c>=1?'pouring in':w.run.c>=.8?'building':'early'}`)+
    kv('Chinook',chinookOpen(d)?`open: 1 hatchery king, ${MIN_KING}″+, through Aug 14`:'retention closed (since Aug 15): release')+kv('Coho','open, part of the 2-salmon limit');
  h+=`<div class="sect">📍 Spots today ${sc?'· 🔭 scouted, exact':'· dock talk, roughly right'}</div>`;
  SPOT_KEYS.map(k=>[k,spotRead(k,d)]).sort((a,b)=>b[1]-a[1]).forEach(([k,q])=>{const s=SPOTS[k],wd=spotWord(q);
    h+=`<div class="todo"><span class="ck">${spotIc(wd)}</span><div><b>${s.n} · ${wd}</b><span>${s.sub}. ${s.txt}${s.k>s.c?' Kings.':' Coho.'}${s.fuel?` +${s.fuel} gal.`:''}</span></div></div>`});
  if(d+1<GAME.days){const w2=trWater(d+1);h+=`<p class="small-note" style="font-size:12.5px;color:var(--mute)">Tomorrow: wind ~${w2.wind} kt. ${S.scout===d+1?'🔭 You’ve scouted it.':'Scout the Slag Pile from Ruston Way for a sharper read.'}</p>`}
  return h;
}

}

// Add a line list here for each release (newest last). Unknown versions get the generic line below.
const CHANGELOG={

// (keeping its timestamp, so the current slot and "newest save" don't change). Returns {count, oldest app version}.
function upgradeAllSaves(){
  const ls=store(),out={count:0,oldest:''};if(!ls)return out;
  for(let n=1;n<=GAME.slots;n++){
    try{
      const r=rawSave(n);if(!r)continue;
      const raw=JSON.parse(r.v),d=migrate(raw);if(d.S.over)continue;
      out.count++;

      if(d.newer)continue; // from a newer version: leave it exactly as it is
      ls.setItem(r.k,JSON.stringify({schema:d.schema,app:APP_VERSION,S:d.S,uiNarr:d.uiNarr,tab:d.tab,at:r.at||d.at}));
    }catch(e){}

function installBarShown(){return installShown()&&(isPhoneOrTablet()||!!deferredInstall)&&!installBarDismissed()}
function installBar(){return installBarShown()?`<div class="inst-bar" id="installBar" role="region" aria-label="Install the app"><span class="ib-t">📲 Play offline: install the app</span>
  <button id="installBarBtn" class="ib-go" onclick="doInstall()">Install</button><button class="ib-x" onclick="dismissInstallBar()" aria-label="Dismiss">✕</button></div>`:''}
window.dismissInstallBar=()=>{try{localStorage.setItem(BAR_KEY,String(Date.now()))}catch(e){}
  const b=document.getElementById('installBar');if(b)b.remove();
  const f=document.querySelector('.title .big');if(f)f.focus();
  if(typeof fitTitle==='function')fitTitle()};
function syncInstallBtn(){const b=document.getElementById('installBtn'),bar=document.getElementById('installBar');
  if(b&&!installShown())b.remove();
  if(bar&&!installBarShown())bar.remove();
  if(document.querySelector('.title')&&((!b&&installShown())||(!bar&&installBarShown())||(b&&!installShown())))titleScreen()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;try{localStorage.removeItem(INSTALLED_KEY)}catch(x){}syncInstallBtn()});
window.addEventListener('appinstalled',()=>{deferredInstall=null;try{localStorage.setItem(INSTALLED_KEY,'1')}catch(e){}syncInstallBtn();
  installToast('✅ Thanks for installing Tacompton! Find it on your home screen. It plays offline, too.')});
// A short note at the bottom of the screen (the title screen has no event tiles).
function installToast(msg){
  document.querySelectorAll('.inst-toast').forEach(e=>e.remove());
  const el=document.createElement('div');el.className='inst-toast';el.setAttribute('role','status');el.setAttribute('aria-live','polite');el.textContent=msg;
  document.body.appendChild(el);setTimeout(()=>el.remove(),6000);
}
// The other browsers' menu steps, by what this browser looks like.
function installSteps(){
  const ua=navigator.userAgent,mobile=/android|mobile/i.test(ua);
  if(/SamsungBrowser/i.test(ua))return ['Tap the menu button (☰) at the bottom of the screen.','Tap <b>Add page to</b>, then <b>Home screen</b>.','Tap <b>Add</b>. Tacompton is now on your home screen.'];
  if(/Firefox|FxiOS/i.test(ua)&&mobile)return ['Tap the browser menu (⋮).','Tap <b>Add app to Home screen</b> (or <b>Install</b>).','Tap <b>Add</b>. Tacompton is now on your home screen.'];
  if(/Firefox/i.test(ua))return ['Firefox on a computer can’t install web apps. Open this page in Chrome or Edge to install it.','Or simply bookmark it: once loaded, the game also plays offline in this browser.'];
  if(!mobile&&/Safari/i.test(ua)&&!/Chrome|Chromium|Edg/i.test(ua))return ['In Safari’s menu bar, choose <b>File → Add to Dock…</b> (macOS Sonoma or later).','Click <b>Add</b>. Tacompton opens from the Dock in its own window.'];
  if(!mobile)return ['Click the install icon (a screen with a down arrow) at the right end of the address bar,','or open the browser menu (⋮ or …) and choose <b>Install Tacompton</b> (Edge: <b>Apps → Install this site as an app</b>).','Click <b>Install</b>. Tacompton gets its own window and a desktop icon.'];
  return ['Open the browser menu (⋮), at the top right.','Tap <b>Install app</b> or <b>Add to Home screen</b>.','Tap <b>Install</b> (or <b>Add</b>). Tacompton is now on your home screen.'];
}
function installSheet(){
  const steps=installSteps();
  modal('📲 Install Tacompton',`<p>Put the game on your home screen: it opens full screen, like an app, and plays offline.</p>
  <ol class="inst-steps">${steps.map(s=>`<li>${s}</li>`).join('')}</ol>
  <p style="font-size:13px;color:var(--mute)">Don’t see it in the menu? Use the game for a minute and look again: some browsers only offer it after a short visit. On Android and computers the installed app keeps this browser’s saved games.</p>`,
  [{l:'Got it',fn:()=>{}}]);
}
window.doInstall=async()=>{
  if(deferredInstall){const ev=deferredInstall;deferredInstall=null;
    try{ev.prompt();const c=await ev.userChoice;if(c&&c.outcome==='accepted'){try{localStorage.setItem(INSTALLED_KEY,'1')}catch(e){}}}catch(e){}
    syncInstallBtn();return}
  if(isIOS()){if(typeof saveGame==='function'&&S&&!S.over)saveGame();location.href='install/ios.html';return}
  installSheet();
};
// ---------------- boot ----------------
applyPrefs();
titleScreen();
</script>
</body>
</html>
