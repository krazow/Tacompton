function keyTargets(){
  const mb=document.getElementById('mbg');
  if(mb) return {where:'modal',list:[...mb.querySelectorAll('.modal > button.act')].filter(keyVisible)};
  if(document.querySelector('.cross'))return {where:'none',list:[]};
  if(typeof S==='undefined'||!S||S.over||!document.querySelector('#app .hud'))return {where:'none',list:[]};
  return {where:'main',list:tab==='act'?[...document.querySelectorAll('#app .content button.act')].filter(keyVisible):[]}}
function keyHints(){try{
  document.querySelectorAll('.kn').forEach(n=>n.remove());
  const {list}=keyTargets();list.slice(0,9).forEach((b,i)=>{const n=document.createElement('i');n.className='kn';n.setAttribute('aria-hidden','true');n.textContent=i+1;b.appendChild(n)})}catch(e){}}
function keysModal(back){
  const row=(k,t)=>`<div class="keys-row"><kbd>${k}</kbd><span>${t}</span></div>`;
  const tabs=Object.entries(keyTabs());
  modal('⌨️ Keyboard shortcuts',`<div class="keys">${[
    row('1 – 9','Press the numbered button (the small number on its right)'),
    row(tabs.map(([c])=>c.toUpperCase()).join(' '),tabs.map(([,k])=>allTabs().find(t=>t[0]===k)[2]).join(', ')+' tabs'),
    row('Esc','Close the pop-up; skip a transition'),
    row('Enter','Press the highlighted button'),
    row('?','This list')].join('')}</div><p style="font-size:12px;color:var(--mute)">Shortcuts never fire while you’re typing.</p>`,
    (back?[{l:'Back to settings',fn:back}]:[]).concat([{l:'Close',fn:()=>{}}]))}
window.keysModal=keysModal;
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||e.repeat)return;
  const t=e.target;if(t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable))return;
  const k=e.key,lk=k.length===1?k.toLowerCase():k;
  if(k==='?'){e.preventDefault();if(!document.getElementById('mbg'))keysModal();return}
  const {where,list}=keyTargets();
  if(/^[1-9]$/.test(k)){const b=list[+k-1];if(b){e.preventDefault();b.click()}return}
  if(where==='modal'){
    if(k==='Escape'){e.preventDefault();escModal()}
    return}
  if(where!=='main')return;
  const kt=keyTabs();if(kt[lk]){e.preventDefault();setTab(kt[lk])}
});
// refresh the hints whenever the screen or a pop-up changes
{let q=false;const go=()=>{q=false;keyHints()};
  try{new MutationObserver(ms=>{if(q)return;if(ms.some(m=>[...m.addedNodes].some(n=>n.nodeType===1&&!n.classList.contains('kn'))||[...m.removedNodes].some(n=>n.nodeType===1&&n.id==='mbg'))){q=true;requestAnimationFrame(go)}})
    .observe(document.body,{childList:true,subtree:true})}catch(e){}}
// ============================================================
//  TACOMPTON · LIFE: game lengths, starting ages, the calendar, aging, and the key-week scheduler.
//  Loaded after the engine (00-09) and before the content (20+). One save holds one whole life.
//
//  ---- Stable API for content (phase-2 agents: use these, don't reach into S.life) ----
//  Calendar (day index 0 = the first morning of the run, always a Monday):
//    dateOf(d)        → {y, m (1–12), d (1–31), dow (0 = Monday … 6 = Sunday, the same as dayName()), label:'Mon Aug 3'}
//    monthDay(d)      → 'Aug 3'          longDate(d) → 'Monday, Aug 3'      fullDate(d) → 'Mon Aug 3, 2026'
//    dayIndexOf(y,m,d)→ the day index of a calendar date (may be negative or past the end)
//    season(d=day())  → 'summer' (Jun–Aug) | 'fall' (Sep–Nov) | 'winter' (Dec–Feb) | 'spring' (Mar–May)
//    isSchoolDay(d=day()) → true on weekdays of the school year: from the Monday of the week of Sept 1 to June 15,
//                     minus winter break (Dec 20 – Jan 2) and spring break (Apr 1–7)
//    isFairDay(d=day()) → the Hilltop Street Fair: every year on the second Saturday of August
//    The run starts Mon Aug 3, 2026 at age 18, Mon Aug 24, 2026 at ages 12 and 15 (LIFE_START).
//  Age and stage:
//    S.age, S.birthday {m, d} (S.birthday.label 'March 14'), stage(age=S.age) → 'middle' (12–13) | 'high' (14–17) | 'adult' (18+)
//    lifeLong()       → true for 6 months, 1 year, 2 years and Lifetime; false for Quick play (today's two-week games)
//  Key weeks (S.keyWeeks[i] = {start, end, kind, from, to}; you play days from..to, the rest is a time skip):
//    lifeKw()         → the key week being played;  lifeKwIs(kind) → its kind is kind
//      kinds: 'start' | 'month' | 'season' | 'birthday' | 'graduation' | 'movein' | 'milestone' | 'retire' | 'final'
//    lifeWeekDays()   → the day indices you play this key week (Quick play: every day)
//  Content registers key-week events with defLifeEvent(e): a defEvent() whose cond also checks the key week.
//    defLifeEvent({id, hook:'wake'|'arrive'|…, kinds:['birthday'], stages:['high'], seasons:['winter'], mode:'grow'|'adult',
//                  cond, chance, run, …})   everything else is plain defEvent (03-events.js)
//    LIFE_HOOKS.weekStart.push(kw=>{…})      the first morning of every key week (after the time skip)
//    LIFE_HOOKS.weekEnd.push(kw=>{…})        the last night of every key week, before the summary
//    LIFE_HOOKS.skip.push((from,to,choice,notes)=>{…})   after a time skip is simulated: push lines to notes
//    LIFE_HOOKS.birthday.push(age=>{…})      every birthday, played or skipped
//    LIFE_HOOKS.plan.push((W,{len,o,T})=>{…})   kids' runs: move W's month/season/milestone weeks ({w, kind, age}) before they are merged
//    LIFE_HOOKS.schoolDay = d=>{…}          runs a Growing Up school day instead of the built-in one (32-school.js)
//    LIFE_HOOKS.memorial = ()=>html          the memorial screen's body for endLife('death') (content comes later)
//    endLife(reason)  → ends the run: 'oldage' shows the life summary, 'death' the memorial, then the score
// ============================================================

const LIFE_START={18:'2026-08-03',15:'2026-08-24',12:'2026-08-24'};
const LIFE_AGES=[12,15,18];
const LIFE_ORDER=['quick','6m','1y','2y','life'];
const LIFE_LEN={
  quick:{n:'Quick play',ic:'⚡',d:'Today’s game: two weeks at 18, or Growing Up’s first week at 12.',short:'Quick'},
  '6m':{n:'6 months',ic:'🍂',d:'About six key weeks, one a month, with a summary between them.',short:'6 mo'},
  '1y':{n:'1 year',ic:'📅',d:'A key week every six weeks or so, plus your birthday: about nine.',short:'1 yr'},
  '2y':{n:'2 years',ic:'🗓️',d:'One key week a season, plus two birthdays: about ten.',short:'2 yrs'},
  life:{n:'Lifetime',ic:'🌳',d:'One or two key weeks a year at the milestones, all the way to old age.',short:'Life'},
};
const LIFE_HOOKS={weekStart:[],weekEnd:[],skip:[],birthday:[],memorial:null,plan:[],schoolDay:null};
const MON3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
let LIFE_PICK=null;   // {length, startAge, birthday}: the start screen's choice, used by the next new game (null = Quick play)

// ---- calendar ----
function lifeStartDate(s){s=s||(typeof S!=='undefined'?S:null);return (s&&s.startDate)||(typeof isGrow==='function'&&isGrow()?LIFE_START[12]:LIFE_START[18])}
function dAt(sd,i){const [y,m,d]=sd.split('-').map(Number);const t=new Date(Date.UTC(y,m-1,d+i)),dow=(t.getUTCDay()+6)%7;
  return {y:t.getUTCFullYear(),m:t.getUTCMonth()+1,d:t.getUTCDate(),dow,label:`${DAYS[dow].slice(0,3)} ${MON3[t.getUTCMonth()]} ${t.getUTCDate()}`}}
function dateOf(d){return dAt(lifeStartDate(),d)}
const monthDay=d=>dateOf(d).label.slice(4);
const longDate=d=>`${dayName(d)}, ${monthDay(d)}`;
const fullDate=d=>{const o=dateOf(d);return `${o.label}, ${o.y}`};
function dIdx(sd,y,m,d){const [a,b,c]=sd.split('-').map(Number);return Math.round((Date.UTC(y,m-1,d)-Date.UTC(a,b-1,c))/864e5)}
function dayIndexOf(y,m,d){return dIdx(lifeStartDate(),y,m,d)}
function seasonOf(o){return o.m===12||o.m<=2?'winter':o.m<=5?'spring':o.m<=8?'summer':'fall'}
function season(d){return seasonOf(dateOf(d==null?day():d))}
function schoolOn(o){
  if(o.dow>=5) return false;
  const Y=o.m>=7?o.y:o.y-1;   // the school year that started in late summer of Y
  const s1=new Date(Date.UTC(Y,8,1)),mon=new Date(Date.UTC(Y,8,1-((s1.getUTCDay()+6)%7))),t=Date.UTC(o.y,o.m-1,o.d);
  if(t<mon.getTime()||t>Date.UTC(Y+1,5,15)) return false;
  if((o.m===12&&o.d>=20)||(o.m===1&&o.d<=2)) return false;
  if(o.m===4&&o.d<=7) return false;
  return true;
}
function isSchoolDay(d){return schoolOn(dateOf(d==null?day():d))}
function isFairDay(d){const o=dateOf(d==null?day():d);return o.m===8&&o.dow===5&&o.d>=8&&o.d<=14}

// ---- age and stage ----
function stage(age){if(age==null)age=(typeof S!=='undefined'&&S&&S.age)||18;return age<14?'middle':age<18?'high':'adult'}
function lifeRandBirthday(){   // a random day of the year, without touching Math.random (seeded runs stay the same)
  let r=0;try{const a=new Uint32Array(1);crypto.getRandomValues(a);r=a[0]}catch(e){r=Date.now()}
  const t=new Date(Date.UTC(2027,0,1+(r%365)));return {m:t.getUTCMonth()+1,d:t.getUTCDate(),label:`${MONTHS[t.getUTCMonth()]} ${t.getUTCDate()}`}}
// the day index on which you turn `age` (o: a save, or {startDate, startAge, birthday})
function lifeBday(o,age){const sd=o.startDate,[y0,m0,d0]=sd.split('-').map(Number),b=o.birthday;
  const y1=(b.m>m0||(b.m===m0&&b.d>d0))?y0:y0+1;return dIdx(sd,y1+(age-o.startAge-1),b.m,b.d)}
const lifeLong=()=>typeof S!=='undefined'&&!!S&&!!S.length&&S.length!=='quick';
const ordinal=n=>n+(n%100>=11&&n%100<=13?'th':['th','st','nd','rd'][n%10]||'th');

// ---- the key-week schedule ----
const KW_PRIO={start:9,final:8,graduation:7,movein:7,retire:6,birthday:5,milestone:2,season:1,month:1};
function lifeBuild(len,o){
  const kid=o.startAge<18,first=kid?8:7,qEnd=kid?7:13;
  if(len==='quick') return [{start:0,end:qEnd,kind:'start'}];
  const W=[],add=(w,kind,x)=>W.push(Object.assign({w,kind},x||{})),bw=a=>Math.floor(lifeBday(o,a)/7);
  let T;
  if(len==='6m'){T=26;for(let i=0;i<6;i++)add(Math.round(i*(T-1)/5),i?'month':'start')}
  else if(len==='1y'){T=52;for(let i=0;i<9;i++)add(Math.round(i*(T-1)/8),i?'month':'start');for(let a=o.startAge+1;bw(a)<T;a++)add(bw(a),'birthday',{age:a})}
  else if(len==='2y'){T=104;add(0,'start');let run=null;const runs=[];
    for(let w=0;w<T;w++){const s=seasonOf(dAt(o.startDate,w*7+3));if(!run||run.s!==s){run={s,a:w,b:w};runs.push(run)}else run.b=w}
    runs.slice(1,-1).forEach(r=>add(Math.round((r.a+r.b)/2),'season'));
    for(let a=o.startAge+1;bw(a)<T;a++)add(bw(a),'birthday',{age:a})}
  else{T=bw(80)+1;add(0,'start');
    for(let a=o.startAge+1;a<=80;a++){const w=bw(a);add(w,a===18&&kid?'graduation':a===67?'retire':'birthday',{age:a});
      if(a===18&&kid)add(w+2,'movein');
      if(a<80&&(a<22||a%5===0))add(Math.floor((lifeBday(o,a)+182)/7),'milestone',{age:a})}}
  if(kid)LIFE_HOOKS.plan.forEach(f=>{try{f(W,{len,o,T})}catch(e){console.error(e)}});   // content can move month/season/milestone weeks onto its own key dates
  add(T-1,'final');
  W.sort((a,b)=>a.w-b.w||KW_PRIO[b.kind]-KW_PRIO[a.kind]);
  const out=[];
  for(const x of W){if(x.w<0||x.w>=T)continue;const p=out[out.length-1];
    if(!p){out.push(x);continue}
    if(x.w-p.w<2||(p.w===0&&kid&&x.w<2)){if(KW_PRIO[x.kind]>KW_PRIO[p.kind]&&p.kind!=='start'){if(p.age&&!x.age)x.age=p.age;out[out.length-1]=x}else if(x.age&&!p.age)p.age=x.age;continue}
    out.push(x)}
  return out.map(x=>{const k={start:x.w*7,end:x.w===0?first-1:x.w*7+6,kind:x.kind};if(x.age)k.age=x.age;return k});
}
// the days you actually play in a key week (Highlights: 3 of them, around a birthday if there is one, else Fri–Sun)
function lifeRange(kw,s){s=s||S;if(kw.from!=null)return {from:kw.from,to:kw.to};
  const hl=s&&s.life&&s.life.weekPlay==='highlights'&&kw.start>0&&s.length!=='quick'&&kw.end-kw.start>=3;
  if(!hl) return {from:kw.start,to:kw.end};
  const b=s.birthday,sd=s.startDate;let from=kw.end-2;
  for(let d=kw.start;d<=kw.end;d++){const o=dAt(sd,d);if(o.m===b.m&&o.d===b.d){from=clamp(d-1,kw.start,kw.end-2);break}}
  return {from,to:from+2};
}
const lifeEndDay=s=>{const k=s.keyWeeks[s.keyWeeks.length-1];return lifeRange(k,s).to};
function lifeKw(){return S&&S.keyWeeks?S.keyWeeks[S.kwi||0]:null}
function lifeKwIs(kind){const k=lifeKw();return !!k&&k.kind===kind}
function lifeWeekDays(){const k=lifeKw();if(!k||!lifeLong())return Array.from({length:GAME.days},(_,i)=>i);const r=lifeRange(k),a=[];for(let d=r.from;d<=r.to;d++)a.push(d);return a}
function lifePlayed(){if(!lifeLong())return Array.from({length:GAME.days},(_,i)=>i);const a=[];S.keyWeeks.slice(0,S.kwi+1).forEach(k=>{const r=lifeRange(k);for(let d=r.from;d<=Math.min(r.to,day());d++)a.push(d)});return a}
// GAME.days follows the save being played: the last key week's last day + 1 (setMode() and adopt() call this)
function lifeSync(){if(typeof S==='undefined'||!S||!S.keyWeeks||!S.keyWeeks.length)return;if((S.mode==='grow')!==(MODE==='grow'))return;GAME.days=lifeEndDay(S)+1}
function kwName(k,s){s=s||S;const o=dAt(s.startDate,k.start+3);
  return {start:'Your first week',final:'The last week',birthday:`Your ${ordinal(k.age||0)} birthday`,graduation:'Graduation',movein:'Moving day',retire:'Retirement',
    milestone:`${MONTHS[o.m-1]}, age ${k.age?k.age:''}`.replace(/, age $/,''),season:`${cap(seasonOf(o))} ${o.y}`,month:`${MONTHS[o.m-1]} ${o.y}`}[k.kind]||'A week'}
// the Week tab's footer in the longer games: the key weeks still to come
function lifeWeekList(){if(!lifeLong())return '';const nx=S.keyWeeks.slice(S.kwi+1);
  return `<div class="sect">Key weeks ahead · ${nx.length} left</div>`+nx.slice(0,6).map(k=>`<div class="todo"><span class="ck">⭐</span><div><b>${kwName(k)}</b><span>from ${fullDate(lifeRange(k).from)}</span></div></div>`).join('')
    +(nx.length>6?`<div class="rules">…and ${nx.length-6} more, to ${fullDate(lifeEndDay(S))}.</div>`:'')}
function defLifeEvent(e){const c=e.cond;defEvent(Object.assign({},e,{cond:ctx=>{const k=lifeKw();if(!k)return false;
  if(e.mode&&(e.mode==='grow')!==isGrow())return false;if(e.kinds&&!e.kinds.includes(k.kind))return false;
  if(e.stages&&!e.stages.includes(stage()))return false;if(e.seasons&&!e.seasons.includes(season()))return false;return c?c(ctx):true}}))}
function lifeHook(name,...a){(LIFE_HOOKS[name]||[]).forEach(f=>{try{f(...a)}catch(e){console.error(e)}})}

// ---- the life part of a save ----
function lifeBlank(x){return {weekPlay:'full',diffWk:-1,snaps:[],moments:[],stages:[{stage:x.stage,age:x.age,d:0}],jobs:[],family:60,tot:{},
  rentHelp:0,rentHelpLeft:0,path:null,parttime:false,prog:0,done:false,retired:false,graduated:false,schoolDays:0,ended:null,grow:null,lastSkip:null}}
function lifeSetup(x,p){
  x.length=p.length;x.startAge=p.startAge;x.age=p.startAge;x.birthday=p.birthday;x.startDate=LIFE_START[p.startAge];
  x.stage=stage(x.age);x.lengthLog=[];x.keyWeeks=lifeBuild(p.length,x);x.kwi=0;x.life=lifeBlank(x);
  const k=x.keyWeeks[0];k.from=k.start;k.to=k.end;
}
// old saves (0.3 and before) are Quick play: adult at 18, Growing Up at 12 (MIGRATIONS in 21-story.js)
function lifeMigrateQuick(x){if(x.length)return;const g=x.mode==='grow';lifeSetup(x,{length:'quick',startAge:g?12:18,birthday:x.birthday||lifeRandBirthday()})}
function lifeMoment(ic,t){if(!S||!S.life)return;S.life.moments.push({d:day(),age:S.age,ic,t});if(S.life.moments.length>80)S.life.moments.splice(1,1)}
// called first thing in onNewGame() (21-story.js)
function lifeNew(){
  const p=LIFE_PICK||{length:'quick',startAge:isGrow()?12:18,birthday:lifeRandBirthday()};LIFE_PICK=null;
  lifeSetup(S,p);
  if(p.startAge===15){S.money=Math.round(S.money*2);S.grades=65}
  if(lifeLong()){
    if(!isGrow()){S.rent.due=lifeKw().to;S.life.jobs=[]}
    lifeMoment('🌱',p.startAge<18?`Moved to Hilltop with your family, age ${p.startAge}.`:'Moved into your own apartment on Hilltop, age 18.');
  }
  lifeSync();
}
function lifeHud(d){return `${dateOf(d).label} · Age ${S.age} · Week ${S.kwi+1} of ${S.keyWeeks.length}`}

// ---- birthdays and the school day (onMorning in 21-story.js calls this every morning) ----
function lifeBirthday(age,played){
  S.age=age;const st=stage(age),lines=[];
  if(isGrow())lines.push(`🎂 You turn ${age}. ${pick(['Mom bakes a lopsided chocolate cake and Dad sings louder than anyone.','Pancakes with a candle in them at breakfast, and Nia made you a card with glitter that will never come off.','Grandma calls first thing and sings the whole song, both verses.'])} A small family celebration${played?' tonight':''}.`);
  else lines.push(`🎂 You turn ${age}. ${pick(['Your family calls on speaker, all at once, and sings badly.','A card in the mail from home, and a cupcake from a neighbor with one candle in it.','Ms. Lorraine across the street somehow knew, and there is a slice of pound cake on your step.'])}`);
  if(isGrow()){adj('family',3);adj('mood',5)}else{S.life.family=clamp(S.life.family+2,0,100);adj('stress',-4)}
  if(st!==S.stage&&!(st==='adult'&&isGrow())){S.stage=st;S.life.stages.push({stage:st,age,d:day()});
    if(st==='high'){lines.push('🎓 High school: Hilltop High, a bus pass in your backpack, and curfew moves to 10 PM.');lifeMoment('🎓','Started high school at Hilltop High.')}}
  if(age===16&&isGrow()){lines.push('🚗 Sixteen: a learner’s permit, and you’re old enough for a part-time job (the corner market on MLK is hiring).');lifeMoment('🚗','Learner’s permit, and a first part-time job allowed.')}
  if(age===67&&!isGrow()&&!S.life.retired){S.life.retired=true;lines.push('🎉 Retirement. The last shift, a sheet cake in the break room, and mornings that belong to you now.');lifeMoment('🎉',`Retired from ${job().place}.`)}
  if([13,16,18,21,30,40,50,60,70,80].includes(age))lifeMoment('🎂',`Turned ${age}.`);
  lifeHook('birthday',age);
  return lines;
}
function lifeMorning(d){
  if(!lifeLong())return;
  const o=dateOf(d),b=S.birthday;
  if(o.m===b.m&&o.d===b.d&&d>0){const lines=lifeBirthday(S.age+1,true);lines.forEach(l=>{say(l);digestLine(l)})}
  if(isGrow()&&typeof gSchoolDay==='function'&&d>gSchoolDay()&&isSchoolDay(d)){
    if(LIFE_HOOKS.schoolDay){LIFE_HOOKS.schoolDay(d);return}   // content can run the school day itself (32-school.js)
    const ok=S.energy>=30&&S.mood>=30;S.life.schoolDays++;S.grades=clamp((S.grades==null?60:S.grades)+(ok?1:0),0,100);
    S.t=Math.max(S.t,d*1440+925);S.loc='home';adj('energy',-12);adj('mood',ok?1:-2);
    say(`🏫 A school day at ${gSchoolShort()}. ${pick(['A pop quiz you were ready for, mostly.','Lunch was loud, PE was louder.','A substitute in math and a real experiment in science.','Group project. Your group is fine. One of them is great.'])} ${ok?'Grades +1.':'You were too tired to follow much.'} Home by ${fmt(925)}.`)}
}

// saves: reading one uses that save's own length for GAME.days (06-save.js clamps the day to it); loading one switches to it
{const mg=migrate;migrate=function(d){const s=d&&d.S;if(!s||!s.keyWeeks||!s.keyWeeks.length)return mg(d);const keep=GAME.days;try{GAME.days=lifeEndDay(s)+1;return mg(d)}finally{GAME.days=keep}}}
{const ad=adopt;adopt=function(d){if(d&&d.S&&d.S.keyWeeks&&d.S.keyWeeks.length)GAME.days=lifeEndDay(d.S)+1;return ad(d)}}

// ---- the end of a key week: the time skip ----
{const ed=endDay;endDay=function(where){
  if(!S||S.over||!lifeLong()) return ed(where);
  const d=day(),kw=lifeKw();
  if(!kw||d<lifeRange(kw).to||S.kwi>=S.keyWeeks.length-1) return ed(where);
  closeModals();const notes=[];
  onNight(where,notes,d);const nctx={where,notes,fired:[]};fireHook('night',nctx);
  const card=dayCard(d);achCheck({night:true,where});
  if(S.over) return;const loss=checkLoss();if(loss) return gameOver(loss);
  lifeWeekEnd(d,card+notes.map(n=>`<p>${n}</p>`).join(''));
}}
// one key week's score: the mode's own score, with cash capped and shifts scaled to a two-week game, so every length compares fairly
function lifeWeekScore(){
  let sc=scoreOf();const k=lifeKw(),r=k?lifeRange(k):{from:0,to:13},n=Math.max(1,Math.min(day(),r.to)-r.from+1);
  if(!isGrow()){sc+=Math.round(clamp(S.money,-2500,2500)*SCORE_W.cash)-Math.round(S.money*SCORE_W.cash);sc+=Math.round(SCORE_W.shift*(S.stats.shifts||0)*(14/n-1))}
  return Math.round(sc);
}
function lifeWeekEnd(d,night){
  const kw=lifeKw();
  S.life.snaps=S.life.snaps.filter(x=>x.kw!==S.kwi);S.life.snaps.push({kw:S.kwi,start:kw.start,score:lifeWeekScore(),mode:MODE});
  if(isGrow()&&S.grades==null)S.grades=clamp(40+Math.round(gReady()*0.5),0,100);
  if(isGrow()&&typeof gBest==='function'){const b=gBest();if(b&&!S.life.best){S.life.best=b.id;lifeMoment('🤝',`Became best friends with ${b.n}.`)}}
  lifeHook('weekEnd',kw);
  const go=()=>lifeSkipSheet(d,night);
  if(isGrow()&&S.age>=18&&!S.life.graduated) return lifeGraduation(go);
  go();
}
function lifeSnapRows(){
  if(isGrow()) return [['💵 Money',S.money,$],['⚡ Energy',S.energy],['🙂 Mood',S.mood],['🏠 Family',S.family],['🤝 Friends',gFriends()],['📚 Grades',S.grades==null?gReady():S.grades],['🎂 Age',S.age]];
  return [['💵 Cash',S.money,$],['😣 Stress',S.stress,null,true],['💼 Job',S.standing],['🤝 Community',S.community],['🏠 Family',Math.round(S.life.family)],['🎂 Age',S.age]]
    .concat(S.life.path&&S.life.path!=='job'?[[S.life.path==='college'?'🎓 College':'🔧 Trade program',Math.round(S.life.prog),v=>v+'%']]:[]);
}
function lifeChoices(){
  if(isGrow()) return [{k:'study',l:'📚 Study hard',s:'Grades up. A little less fun, a little less time with friends.'},{k:'home',l:'🏠 Help out at home',s:'Chores, dinners, Nia. Family up, and a few extra dollars from chores.'},
    {k:'friends',l:'🤝 See friends more',s:'Friends and mood up. Grades and home slip a little.'},...(S.age>=16?[{k:'work',l:'🧾 Pick up shifts at the market',s:'Weekend shifts at the corner market: money up, grades a little down.'}]:[])];
  if(S.life.retired) return [{k:'friends',l:'🤝 See friends more',s:'The block club, the bench at the overlook, the grandkids next door. Community up, stress down.'},{k:'save',l:'🐷 Keep it simple',s:'Cook at home, call family. Costs down, family up.'},{k:'extra',l:'🤲 Volunteer more',s:'The free fridge, the reading program. Community up, a little tired.'}];
  return [{k:'extra',l:'💼 Pick up extra shifts',s:'More money and job standing, more stress, less time for the neighborhood.'},{k:'save',l:'🐷 Save money',s:'Cook at home, skip the extras, call home more. Costs down, a little calmer.'},
    {k:'friends',l:'🤝 See friends more',s:'Block club, pickup games, porch nights. Community up, stress down, a bit more spent.'}];
}
function lifeSkipSheet(d,night){
  const i=S.kwi+1,nk=S.keyWeeks[i],r=lifeRange(nk),from=d+1,to=r.from-1,wk=Math.max(1,Math.round((to-from+1)/7));
  const before=lifeSnapRows();
  const body=`${night?`<div class="digest"><div class="sect">🌙 ${dayName(d)} night</div>${night}</div>`:''}
    <p><b>Key week ${S.kwi+1} of ${S.keyWeeks.length} is done.</b> Next up: <b>${kwName(nk)}</b>, ${monthDay(r.from)} to ${fullDate(r.to)}.</p>
    <p>That’s about <b>${wk} week${wk===1?'':'s'}</b> from here. How do you spend them?</p>`;
  modal(`⏩ ${monthDay(from)} → ${monthDay(to)}`,body,lifeChoices().map(c=>({l:c.l,s:c.s,np:true,stay:true,fn:()=>{
    const notes=lifeSimulate(from,to,c.k);S.life.lastSkip={from,to,choice:c.k};lifeHook('skip',from,to,c.k,notes);lifeRound();
    lifeResultSheet(before,notes,i,c)}})),true);
}
function lifeResultSheet(before,notes,i,c){
  const after=lifeSnapRows(),nk=S.keyWeeks[i],r=lifeRange(nk);
  const rows=after.map(([k,v,f,bad],j)=>{const b=before.find(x=>x[0]===k),bv=b?b[1]:v,dv=Math.round(v-bv),fm=f||(x=>Math.round(x));
    const col=dv===0?'var(--mute)':((dv>0)!==!!bad?'var(--good,#2f8f6a)':'var(--bad,#c0392b)');
    return `<div class="kv"><span>${k}</span><b>${fm(bv)} → ${fm(v)} <small style="color:${col}">${dv===0?'':(dv>0?'+':'−')+(f===$?$(Math.abs(dv)):Math.abs(dv))}</small></b></div>`}).join('');
  const prog=isGrow()?`<div class="kv"><span>🏫 School</span><b>${gSchoolShort()} · grades ${S.grades}</b></div>`:`<div class="kv"><span>💼 Work</span><b>${S.life.retired?'retired':`${job().ic} ${job().role}${S.life.parttime?' (part-time)':''}`}</b></div>`;
  const ppl=isGrow()?(()=>{const k=KIDS.filter(x=>gMet(x.id)).sort((a,b)=>gF(b.id)-gF(a.id)).slice(0,3);return k.length?`<div class="kv"><span>🤝 Closest friends</span><b>${k.map(x=>x.n).join(', ')}</b></div>`:''})()
    :`<div class="kv"><span>🤝 Neighbors who know you</span><b>${metCount()}</b></div>`;
  const body=`<p>You chose <b>${c.l.replace(/^\S+\s/,'')}</b>.</p><div class="sect">What changed</div>${rows}${prog}${ppl}${notes.length?`<div class="sect">Along the way</div>${notes.map(n=>`<p>${n}</p>`).join('')}`:''}`;
  if(S.over) return;
  const loss=checkLoss();
  modalSwap('📋 While you were away',body,[{l:loss?'See what happened':`▶️ Play ${kwName(nk).replace(/^Your/,'your')}: ${dateOf(r.from).label}`,fn:()=>{if(loss)return gameOver(loss);lifeEnter(i)}}],true);
}
// a few weeks of life, day by day: money, stats, rent, school, birthdays
function lifeSimulate(from,to,ch){
  const notes=[],grow=isGrow();let rentN=0,rentAmt=0,helpAmt=0,fair=false,school=0,cash0=S.money;
  const f={},num=k=>f[k]!=null?f[k]:(f[k]=S[k]);
  for(let d=from;d<=to;d++){
    const o=dateOf(d),wd=d%7;
    if(o.m===S.birthday.m&&o.d===S.birthday.d){const ls=lifeBirthday(S.age+1,false);if(grow){money(20)}notes.push(...ls)}
    if(grow){
      if(wd===5)money(10+(ch==='home'?5:0));
      if(ch==='work'&&S.age>=16&&wd>=5)money(45);
      money(-0.5);
      const sd=schoolOn(o);if(sd)school++;
      f.grades=clamp((f.grades!=null?f.grades:(S.grades==null?60:S.grades))+(sd?(ch==='study'?0.35:ch==='friends'||ch==='work'?-0.05:0.12):0),0,100);
      f.mood=num('mood')+(60-num('mood'))*0.02+(ch==='friends'?0.25:ch==='study'?-0.08:0.05);
      f.family=num('family')+(60-num('family'))*0.01+(ch==='home'?0.3:ch==='friends'?-0.08:0);
      for(const k of KIDS){const s=S.kids[k.id];if(!s||!s.met)continue;s.f=clamp(s.f+(ch==='friends'?0.1:ch==='study'?-0.02:0.01),0,20)}
    }else{
      const J=job(),pf=lifePayF();
      if(!S.life.retired){
        if(J.days.includes(wd)){money(J.pay*pf+(J.tips?(J.tips[0]+J.tips[1])/2:0));S.life.tot.shifts=(S.life.tot.shifts||0)+1}
        if(ch==='extra'&&wd===(J.days[0]===0?5:0))money(J.pay*pf*0.9);
      }else money(500/7);
      money(-((45+40+20)/7*(DF().cost||1)*(ch==='save'?0.75:1)+(ch==='friends'?25/7:0)));
      if(o.d===1){const help=S.life.rentHelpLeft>0?Math.min(S.life.rentHelp,S.rent.amt):0;money(-(S.rent.amt-help));rentN++;rentAmt+=S.rent.amt;helpAmt+=help;if(help)S.life.rentHelpLeft--;
        if(S.life.path&&!S.life.done&&S.life.path!=='job')money(-(S.life.path==='college'?380:120))}
      if(isFairDay(d)){fair=true;S.fair=true;S.fairYear=o.y}
      f.standing=num('standing')+(75-num('standing'))*0.01+(ch==='extra'&&!S.life.retired?0.15:0);
      const tgt=ch==='extra'?(S.life.retired?30:50):ch==='save'?28:22;f.stress=num('stress')+(tgt-num('stress'))*0.03;
      f.community=num('community')+0.07+(ch==='friends'?0.2:ch==='extra'&&S.life.retired?0.15:0)-(ch==='extra'&&!S.life.retired?0.05:0);
      S.life.family=clamp(S.life.family+(60-S.life.family)*0.003+(ch==='save'?0.07:ch==='extra'?-0.03:0),0,100);
      if(S.life.path&&S.life.path!=='job'&&!S.life.done){S.life.prog=Math.min(100,S.life.prog+100/(S.life.path==='college'?4*365:365));
        if(S.life.prog>=100){S.life.done=true;S.life.parttime=false;const t=S.life.path==='college'?'🎓 You finish your degree at UW Tacoma. Your family fills a whole row at the ceremony.':'🔧 You finish the trade program and test out as a journey-level electrician’s helper. Better pay from here on.';notes.push(t);lifeMoment(S.life.path==='college'?'🎓':'🔧',t.replace(/^\S+\s/,''))}}
    }
    if(S.age>=18&&grow)break;   // graduation comes next
  }
  for(const k in f) S[k]=clamp(Math.round(f[k]),0,100);
  S.money=Math.round(S.money);
  S.energy=80;if(!grow)S.food=Math.max(S.food,3);
  if(!grow&&rentN)notes.push(`🧾 Rent paid ${rentN} time${rentN===1?'':'s'} (${$(rentAmt)})${helpAmt?`, ${$(helpAmt)} of it from your family`:''}.`);
  if(grow&&school)notes.push(`🏫 ${school} school day${school===1?'':'s'} at ${gSchoolShort()}. Grades: ${S.grades}.`);
  if(fair){notes.push('🎪 The Hilltop Street Fair came around again in August. You were there, in the barbecue line.');if(!S.life.moments.some(m=>m.ic==='🎪'))lifeMoment('🎪','The Hilltop Street Fair: the first of many.')}
  const dm=Math.round(S.money-cash0);notes.push(`💵 ${dm>=0?'Saved':'Spent down'} ${$(Math.abs(dm))} over these weeks.`);
  return notes;
}
// after a time skip: whole numbers on every stat (the day-by-day simulation adds fractions, e.g. friendship +0.1 a day)
function lifeRound(){
  for(const k of ['money','energy','mood','family','grades','stress','standing','community','food'])if(typeof S[k]==='number')S[k]=Math.round(S[k]);
  if(S.kids)for(const id in S.kids){const s=S.kids[id];if(s&&typeof s.f==='number')s.f=clamp(Math.round(s.f),0,20)}
}
const lifePayF=()=>(S&&S.life?(S.life.parttime?0.6:1)*(S.life.done&&S.life.path!=='job'?1.25:1):1);
// the first morning of key week i
function lifeEnter(i){
  if(isGrow()&&S.age>=18&&!S.life.graduated) return lifeGraduation(()=>lifeEnter(i));
  for(const k in S.stats)if(typeof S.stats[k]==='number')S.life.tot[k]=(S.life.tot[k]||0)+S.stats[k];
  S.kwi=i;const kw=S.keyWeeks[i],r=lifeRange(kw);kw.from=r.from;kw.to=r.to;lifeSync();
  S.stats=newState().stats;if(!isGrow())S.stats.neighbors=metCount();
  if(S.log.length>300)S.log=S.log.slice(-300);if(S.ev.history.length>300)S.ev.history=S.ev.history.slice(-300);
  if(!isGrow()){const has1=[...Array(kw.end-kw.start+1)].some((_,j)=>dateOf(kw.start+j).d===1);
    S.rent=Object.assign({},S.rent,has1?{due:r.to,paid:false,paidDay:-1}:{due:-1,paid:true,paidDay:r.from});
    S.haircut=false;const y=dateOf(r.from).y;if(S.fairYear!==y&&!isFairDay(r.from))S.fair=false}
  closeModals();S.cur=r.from;S.t=S.cur*1440+S.alarm;S.loc='home';uiNarr=[];
  say(`📅 <b>${kwName(kw)}</b>: ${monthDay(r.from)} to ${fullDate(r.to)}. Age ${S.age}.${!isGrow()&&!S.rent.paid?` Rent (${$(S.rent.amt)}) is due by ${longDate(S.rent.due)}.`:''}`);
  lifeHook('weekStart',kw);
  DIGEST={night:'',items:[],lines:[],held:[],open:false,from:r.from-1,nightIds:[]};
  startDay();const D=DIGEST;DIGEST=null;morningReport(D,r.from-1);render();
}

    <div class="kv"><span>🏠 Family</span><b>${S.family}</b></div><div class="kv"><span>🤝 Friends</span><b>${gFriends()}</b></div><div class="kv"><span>📚 Grades</span><b>${S.grades==null?gReady():S.grades}</b></div>`;

function lifeHandoff(path,jk,next){
  const fam=S.family,fr=gFriends(),gr=S.grades==null?gReady():S.grades,b=gBest();
  S.life.grow={family:fam,friends:fr,grades:gr,best:b?b.n:null,kids:KIDS.filter(k=>gMet(k.id)).map(k=>({n:k.n,f:Math.round(gF(k.id))}))};

  setMode('adult');const A=newState(),keep=S.money;
  for(const k in A) S[k]=A[k];
  S.mode='adult';S.money=keep+Math.round(fam*4);S.job=jk;S.jobPicked=true;S.alarm=JOBS[jk].alarm;
  S.community=clamp(5+Math.round(fr*0.5),0,100);S.standing=clamp(50+Math.round(gr*0.3),0,100);S.stress=25;
  Object.assign(S.life,{family:fam,rentHelp:Math.round(fam*3/10)*10,rentHelpLeft:12,path,parttime:path!=='job',prog:0,done:false,graduated:true});
  S.stage='adult';S.life.stages.push({stage:'adult',age:S.age,d:day()});S.life.jobs.push({job:jk,age:S.age,path});

    <div class="kv"><span>🤝 Friends ${fr}</span><b>Community starts at ${S.community}</b></div>
    <div class="kv"><span>📚 Grades ${gr}</span><b>Job standing starts at ${S.standing}</b></div>

// ---- the end ----
function lifeScore(){
  const sn=(S.life&&S.life.snaps||[]).slice().sort((a,b)=>a.kw-b.kw),k=lifeKw();
  if(!sn.some(x=>x.kw===S.kwi))sn.push({kw:S.kwi,start:k.start,score:lifeWeekScore()});
  const end=Math.min(day(),lifeRange(k).to)+1;let w=0,t=0;
  sn.forEach((x,j)=>{const nx=j+1<sn.length?sn[j+1].start:end,m=Math.max(1,nx-x.start)/30.44;w+=m;t+=x.score*m});
  return Math.round(w?t/w:0);
}
const lifeMonths=()=>Math.max(0.5,Math.round((Math.min(day(),lifeRange(lifeKw()).to)+1)/30.44*2)/2);
{const fi=finish;finish=function(){if(!lifeLong())return fi();if(S.length==='life')return endLife('oldage');lifeFinish('done')}}
function lifeFinish(kind){
  S.over=true;clearTiles();closeModals();sfx('win');S.life&&(S.life.ended=kind);
  const L0=LIFE_LEN[S.length]||LIFE_LEN.quick;
  if(!lifeLong()) return endScreen('{{name}}, you called it here',`You stopped on ${fullDate(day())}. ${FINISH_TEXT.sub()}`);
  endScreen(kind==='here'?`{{name}}, you called it here`:`{{name}}: ${L0.n} on Hilltop`,`${fullDate(0)} to ${fullDate(day())}. Age ${S.startAge} to ${S.age}, ${S.keyWeeks.slice(0,S.kwi+1).length} key weeks played.`);
}
function endLife(reason){
  if(!S)return;S.over=true;clearTiles();closeModals();S.life.ended=reason;
  const memo=reason==='death';
  const top=memo?(typeof LIFE_HOOKS.memorial==='function'?LIFE_HOOKS.memorial():`<h1>In memory of {{name}}</h1><p>${fullDate(0).slice(4)} on Hilltop, at ${S.startAge}, to ${fullDate(day())}, at ${S.age}. The block club sets out folding chairs and everybody brings a dish.</p>`)
    :`<h1>A life on Hilltop</h1><p>{{name}}, from ${S.startAge} to ${S.age}: ${fullDate(0)} to ${fullDate(day())}.</p>`;
  app.innerHTML=withName(`<div class="end life-sum">${top}${lifeSummaryHTML()}<button class="big" style="width:100%;margin-top:22px" onclick="lifeToScore()">See the score</button></div>`);
  window.scrollTo(0,0);sfx(memo?'info':'win');
}
window.endLife=endLife;
window.lifeToScore=()=>endScreen(S.life.ended==='death'?'In memory of {{name}}':'{{name}}, a whole life on Hilltop',`Age ${S.startAge} to ${S.age}. ${S.life.moments.length} moments worth remembering.`);
function lifeSummaryHTML(){
  const L1=S.life,sect=(h,b)=>b?`<div class="sect" style="margin-top:14px">${h}</div>${b}`:'',kv=(k,v)=>`<div class="kv"><span>${k}</span><b style="text-align:right">${v}</b></div>`;

  const jobs=L1.jobs.map(j=>kv(`${JOBS[j.job].ic} ${cap(JOBS[j.job].role)}`,`from age ${j.age}${j.path==='college'?', with college':j.path==='trade'?', with a trade program':''}`)).join('')+(L1.retired?kv('🎉 Retired','at 67'):'');
  const kids=L1.grow?L1.grow.kids:(typeof KIDS!=='undefined'&&S.kids?KIDS.filter(k=>S.kids[k.id]&&S.kids[k.id].met).map(k=>({n:k.n,f:Math.round(S.kids[k.id].f)})):[]);
  const nb=typeof NEIGHBORS!=='undefined'&&S.met?NEIGHBORS.filter(x=>S.met[x.id]).map(x=>x.n):[];
  const people=(kids.length?kv('🤝 Friends from growing up',kids.map(k=>k.n).join(', ')):'')+(L1.grow&&L1.grow.best?kv('⭐ Best friend',L1.grow.best):'')+(nb.length?kv('🏘️ Neighbors',nb.slice(0,8).join(', ')+(nb.length>8?` and ${nb.length-8} more`:'')):'')+kv('🏠 Family',isGrow()?S.family:Math.round(L1.family));
  const mom=L1.moments.slice(-14).map(m=>`<div class="todo"><span class="ck">${m.ic}</span><div><b>Age ${m.age}</b><span>${m.t}</span></div></div>`).join('');
  return sect('Stages',stages)+sect('Work',jobs)+sect('People',people)+sect('Moments',mom);

// best scores: one per length, and every run's length and starting age
const RUNS_KEY=KEY('runs');
function lifeRuns(){try{const a=JSON.parse(localStorage.getItem(RUNS_KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function lifeRecord(sc,lost){if(lost)return false;const a=lifeRuns(),len=(S&&S.length)||'quick',prev=a.filter(r=>r.len===len).reduce((m,r)=>Math.max(m,r.sc),-Infinity);
  a.push({sc,len,age:(S&&S.startAge)||18,end:S&&S.age,mode:isGrow()?'grow':'adult',name:currentName(),at:Date.now()});a.sort((x,y)=>y.sc-x.sc);
  try{localStorage.setItem(RUNS_KEY,JSON.stringify(a.slice(0,30)))}catch(e){}return sc>prev}

const MEET_COMMUNITY=2;   // community for each new neighbor you meet
// Meet someone new here (or anyone not met yet). Returns the neighbor, or null when you know everybody.
function meetHere(loc=S.loc){
  const left=NEIGHBORS.filter(x=>!S.met[x.id]),here=left.filter(x=>x.at.includes(loc)),p=here.length?here:left;
  if(!p.length) return null;
  const x=pick(p);S.met[x.id]=day()+1;S.stats.neighbors=Object.keys(S.met).length;adj('community',MEET_COMMUNITY);
  return x;
}
const metCount=()=>Object.keys(S.met||{}).length;

// Minutes between places, on foot or by Link (symmetric). All short: Hilltop is a walking neighborhood.
const TRAVEL={'home|mlk':6,'home|work':12,'home|link':8,'home|peoples':10,'home|view':12,
  'mlk|work':8,'mlk|link':4,'mlk|peoples':5,'mlk|view':10,
  'work|link':4,'work|peoples':10,'work|view':14,
  'link|peoples':6,'link|view':12,'peoples|view':12};
function travelMins(a,b){if(isGrow())return GROW.travelMins(a,b);
  const ha=(L[a]||{}).hood,hb=(L[b]||{}).hood;
  if(ha===hb) return TRAVEL[a+'|'+b]??TRAVEL[b+'|'+a]??10;
  // across neighborhoods: walk to your stop, ride, walk from the other stop. Hilltop's stop is the Link station.
  const leg=(k,h)=>{const hub=h?HOODS[h].hub:'link';return k===hub?0:(TRAVEL[k+'|'+hub]??TRAVEL[hub+'|'+k]??8)};
  const ride=h=>h?HOODS[h].ride.mins:0;
  return leg(a,ha)+leg(b,hb)+(ha&&hb?Math.max(ride(ha),ride(hb))+6:ride(ha)+ride(hb));
}

// ---- Tacoma beyond Hilltop: each src/js/22-hood-*.js file registers one neighborhood with defHood() ----
// defHood({key, name, ic, blurb, hub:'<place key where the ride arrives>', ride:{via:'🚈 Link'|'🚌 Bus'|'🚶 Walk', mins, fare},
//          places:{key:{name, ic, desc, art, hours?}}, travel:{'a|b':mins}, neighbors:[{id,n,ic,at:[place keys],d}],
//          actions:(loc,d,m)=>[...actions like actionsHere's], tips?:[...]})
// Places get .hood=key; the adult game only (Growing Up keeps to Hilltop for now).
const HOODS={};
function defHood(h){
  HOODS[h.key]=h;
  for(const [k,p] of Object.entries(h.places)){ if(L[k]) throw new Error('defHood: place key taken: '+k); L[k]=Object.assign({hood:h.key},p) }
  Object.assign(TRAVEL,h.travel||{});
  (h.neighbors||[]).forEach(x=>NEIGHBORS.push(x));
}
const hoodOf=k=>(L[k]||{}).hood||null;
const hoodName=h=>h?HOODS[h].name:'Hilltop';
// fare for a trip between neighborhoods (the rider pays the bus; the Link is free)
function hoodFare(a,b){const ha=hoodOf(a),hb=hoodOf(b);if(ha===hb)return 0;const f=h=>h?(HOODS[h].ride.fare||0):0;return rp(Math.max(f(ha),f(hb)))}
// the neighborhood's own actions, merged into actionsHere()
function hoodActions(){S.hoodFlags=S.hoodFlags||{};S.hoods=S.hoods||{};const h=hoodOf(S.loc);if(!h||!HOODS[h].actions)return [];try{return HOODS[h].actions(S.loc,day(),tod())||[]}catch(e){console.error(e);return []}}

  if(J.tips){tip=Math.round((J.tips[0]+Math.random()*(J.tips[1]-J.tips[0]))*(.6+S.standing/250)*frac);S.stats.tips+=tip}
  S.worked[d]=late;S.stats.shifts++;pass(J.end-tod());money(pay+tip);S.stats.earned+=pay+tip;
  adj('energy',-J.energy);adj('stress',shiftStress(J));

    if(good) notes.push(`😴 In bed before ${fmt(BAL.goodSleepBy)}: a real night’s sleep. Stress −${BAL.goodSleep}.`)}
  if(!S.rent.paid&&DF().worry) adj('stress',DF().worry);   // rent on your mind
  if(isShiftDay(d)&&!(d in S.worked)){const hit=S.stats.missed?BAL.missed[1]:BAL.missed[0];adj('standing',-hit);adj('stress',BAL.missedStress);S.stats.missed++;notes.push(`📵 You missed your shift at ${J.place}. ${S.job==='hospital'?'The floor ran short a CNA all day.':S.job==='kitchen'?'They worked the line one cook short.':'Your coworker opened alone.'} ${S.stats.missed===1?`Your manager texts: “Everything okay? Don’t make it a habit.” Job −${hit}.`:`Job −${hit}.`}`)}
  if(d===S.rent.due&&!S.rent.paid){
    if(S.money>=S.rent.amt){spend(S.rent.amt);S.rent.paid=true;S.rent.paidDay=d;adj('stress',4);notes.push(`🧾 You pay rent from bed at 11:58 PM: ${$(S.rent.amt)}. Cutting it close.`)}
    else{S.evicted=true;notes.push(`🧾 Rent was due tonight and you have ${$(Math.round(S.money))} of ${$(S.rent.amt)}.`)}
  }
  if(S.energy<15){adj('stress',6);notes.push('🥱 You’re running on fumes.')}
  if(S.stress>=80) notes.push('😣 Your stress is near the edge. Tomorrow, take something for yourself: a swim, the overlook, a call home.');
}
function onTime(min){if(isGrow())return GROW.onTime(min);if(min>0)adj('energy',-min/50)}        // being awake is tiring
function onArrive(dest,from){if(isGrow())return GROW.onArrive(dest,from);S.visited[dest]=true;S.hoodFlags=S.hoodFlags||{};
  const f=typeof hoodFare==='function'?hoodFare(from,dest):0;
  if(f){spend(f);S.stats.fares=(S.stats.fares||0)+f;say(`🚌 Bus fare: ${$(f)}.`)}
  const h=typeof hoodOf==='function'?hoodOf(dest):null;if(h&&typeof hoodOf==='function'&&hoodOf(from)!==h){S.hoods=S.hoods||{};if(!S.hoods[h]){S.hoods[h]=day()+1;say(`${HOODS[h].ic} <b>${HOODS[h].name}</b>. ${HOODS[h].blurb}`)}}}
function daySummary(d){if(isGrow())return GROW.daySummary(d);const sd=isShiftDay(d);return [`⚡ ${S.energy}`,`😣 ${S.stress}`,`🤝 ${S.community}`,sd?(d in S.worked?(S.worked[d]?`💼 ${S.worked[d]} min late`:'💼 on time'):'💼 missed'):'']}
function hudDay(d){if(lifeLong()&&!(isGrow()&&d===gSchoolDay()))return lifeHud(d);if(isGrow())return GROW.hudDay(d);return `${augDate(d)} · Day ${d+1} of ${GAME.days}`}

function checkLoss(){if(isGrow())return GROW.checkLoss();if(S.standing<=0)return 'fired';if(S.stress>=100)return 'burnout';if(S.evicted||S.money< -500)return 'evicted';return null}

// ---- To-do tab goals: {l, s, ok, fail, urgent} ----
function todoItems(){
  if(isGrow()) return GROW.todoItems();
  const d=day(),m=tod(),J=job(),it=[];
  if(isShiftDay(d)) it.push({l:`${J.ic} Work today`,s:d in S.worked?(S.worked[d]?`Done, ${S.worked[d]} min late`:'Done, on time'):`${fmt(J.start)}–${fmt(J.end)}, ${J.place}`,ok:d in S.worked,fail:!(d in S.worked)&&m>=J.end-60,urgent:!(d in S.worked)&&m>=J.start-60&&m<J.end-60});
  it.push({l:'Pay rent',s:S.rent.paid?`Paid on ${augDate(S.rent.paidDay)}.`:`${$(S.rent.amt)} by ${rentBy()}. You have ${$(Math.round(S.money))}.`,ok:S.rent.paid,urgent:!S.rent.paid&&d>=S.rent.due-2});
  it.push({l:'Keep food in the fridge',s:`${S.food} meal${S.food===1?'':'s'}. You eat 1 every night.`,ok:S.food>=2,urgent:S.food<1});
  it.push({l:'Keep stress under 70',s:`Stress ${S.stress}/100. At 100 you burn out.`,ok:S.stress<70,urgent:S.stress>=85});
  it.push({l:'Keep your job in good standing',s:`Job ${S.standing}/100. At 0 you’re let go.`,ok:S.standing>=50,urgent:S.standing<25});
  it.push({l:'Meet your neighbors',s:`${metCount()} of ${NEIGHBORS.length} · community ${S.community}/100`,ok:metCount()>=6});
  it.push({l:`Unpack your boxes`,s:`${S.unpacked} of ${BOXES}. One a day, at home.`,ok:S.unpacked>=BOXES});
  const fd=lifeWeekDays().find(isFairDay);
  if(fd!=null) it.push({l:'Optional: the Hilltop Street Fair',s:`${augDate(fd)} on MLK, 10 AM–6 PM.`,ok:S.fair,fail:!S.fair&&(d>fd||(d===fd&&m>=FAIR_HOURS[1]))});
  return it;
}

const GRADE_CUTS=[3850,3000,2200,1500];   // A, B, C, D (the same on every difficulty; tuned with tools/sim.js)

let FINISH_TEXT={h1:'{{name}}, you made it through your first two weeks',sub:()=>`Mon Aug 3 to Sun Aug 16, 2026. ${S.rent.paid?'Rent is paid, ':''}${metCount()} neighbor${metCount()===1?'':'s'} know your name, and the Link is still dinging down on MLK.`};
function scoreParts(){
  if(isGrow()) return GROW.scoreParts();
  const w=SCORE_W,s=S.stats,early=S.rent.paid&&rentEarly(S.rent.paidDay);
  return [['Cash',S.money*w.cash,`${$(Math.round(S.money))} in the bank × ½`],['Community',S.community*w.community,`${S.community} × ${w.community}`],['Job',S.standing*w.standing,`${S.standing} × ${w.standing}`],
    ['Stress',-S.stress*w.stress,`${S.stress} × −${w.stress}`],['Shifts',s.shifts*w.shift,`${s.shifts} × ${w.shift}`],
    ['Street fair',S.fair?w.fair:0,S.fair?'went':'missed'],['Rent paid early',early?w.early:0,early?'in the first week':'—'],
    ['Unpacked',S.unpacked>=BOXES?w.unpacked:0,`${S.unpacked} of ${BOXES} boxes`],['Every neighbor',metCount()>=NEIGHBORS.length?w.neighbors:0,`${metCount()} of ${NEIGHBORS.length}`]].map(([k,v,n])=>[k,Math.round(v)||0,n]);
}
function scoreOf(){return scoreParts().reduce((a,r)=>a+r[1],0)}
function gradeOf(sc){
  if(isGrow()) return GROW.gradeOf(sc);
  if(sc>=GRADE_CUTS[0]) return ['A','Hilltop Local','Grace saves you the good avocados, Linh starts your order when you walk in, and Ms. Lorraine tells people you’re family.'];
  if(sc>=GRADE_CUTS[1]) return ['B','Settling In','You know which Link car has the working AC and whose porch has the best gossip.'];
  if(sc>=GRADE_CUTS[2]) return ['C','Getting By','Rent’s paid, mostly on time, mostly on caffeine.'];
  if(sc>=GRADE_CUTS[3]) return ['D','Still Unpacking','You live here. You’re not sure you’ve arrived yet.'];
  return ['F','Starting Over','Hilltop will still be here. It’s been here through a lot.'];
}
function endRows(){
  if(isGrow()) return GROW.endRows();
  const s=S.stats,J=job();

}

const eaShip=(x,n,b=112,s=1)=>{
  const cols=['#2a6fa8','#b8402a','#2f8f6a','#c98a12','#5d6a75','#8e44ad'];
  const stack=(cx,rows,seed)=>Array.from({length:rows},(_,r)=>`<rect x="${cx}" y="${-12-r*7}" width="13" height="6.5" fill="${n?'#2c3138':cols[(seed+r*2)%cols.length]}"/>`).join('');
  return `<g transform="translate(${x},${b}) scale(${s})"><path d="M0 -10 H150 l-8 12 H10 z" fill="${n?'#2a1f22':'#2e3a46'}"/><rect x="0" y="-12" width="150" height="3" fill="${n?'#4a2a26':'#b8402a'}"/>
  ${[0,1,2,3,4,5,6,7].map(i=>stack(6+i*14,i%3===1?4:3,i)).join('')}
  <rect x="124" y="-36" width="20" height="26" fill="${n?'#4a4f55':'#efe8da'}"/><rect x="127" y="-33" width="14" height="4" fill="${win(n)}"/><rect x="120" y="-42" width="28" height="6" fill="${n?'#3a3f45':'#d5ccb8'}"/><rect x="132" y="-52" width="3" height="10" fill="${n?'#555':'#666'}"/>${n?'<circle cx="146" cy="-39" r="1.6" fill="#f7d77a"/><circle cx="12" cy="-14" r="1.4" fill="#f7d77a"/>':''}</g>`};

  migrate=function(d){return withMode(saveMode(d),()=>mig(d))};
  adopt=function(d){setMode(saveMode(d));return adp(d)};}
// The adult game's events and achievements only run in the adult game.
EV.forEach(e=>{const c=e.cond;e.cond=c?ctx=>!isGrow()&&c(ctx):()=>!isGrow()});
ACH.forEach(a=>{const t=a.test;a.test=c=>!isGrow()&&t(c)});
// Growing Up's events: defEvent with the mode check built in
function gEvent(e){const c=e.cond;defEvent(Object.assign({},e,{cond:c?ctx=>isGrow()&&c(ctx):()=>isGrow()}))}

KIDS.forEach(k=>{const d0=k.d;Object.defineProperty(k,'d',{enumerable:true,get(){const a=(typeof S!=='undefined'&&S&&S.age)||12;
  return d0.replace(/^Twelve/,cap(gAgeWord(a))).replace(/\. Twelve\./,`. ${cap(gAgeWord(a))}.`).replace('Turns thirteen',`Turns ${gAgeWord(a+1)}`).replace('Summit View too',`${gSchoolShort()} too`)}})});

const gMet=id=>!!(S.kids[id]&&S.kids[id].met);
const gMetCount=()=>KIDS.filter(k=>gMet(k.id)).length;
const gF=id=>(S.kids[id]&&S.kids[id].f)||0;
// Friends (0–100): everyone's friendship added up
const gFriends=()=>Math.min(100,KIDS.reduce((a,k)=>a+gF(k.id),0));
// meet a kid (if new) and add friendship; returns true when you just met
function gFriend(id,n){const k=S.kids[id]||(S.kids[id]={met:0,f:0}),first=!k.met;if(first)k.met=day()+1;k.f=clamp(k.f+n,0,20);return first}
function gBest(){let b=null;for(const k of KIDS){const f=gF(k.id);if(f>=12&&(!b||f>gF(b.id)))b=k}return b}
function gKidsHere(){return KIDS.filter(k=>k.at.includes(S.loc)&&gAt(k.win[0],k.win[1])&&!(k.outdoor&&gRain()))}

GROW.statusTags=()=>{
  const t=[],d=day(),m=tod();
  t.push(gCh1()?`<span class="tag">🎒 ready ${gReady()}%</span>`:`<span class="tag">📚 grades ${gGrades()}</span>`);
  if(S.loc!=='home'&&m<gCurfew()) t.push(`<span class="tag ${m>=gCurfew()-45?'bad':''}">🏠 home by ${fmt(gCurfew())}</span>`);
  if(gRain()) t.push('<span class="tag">🌧️ rainy day</span>');
  if(S.energy<25) t.push('<span class="tag bad">🥱 tired</span>');
  if(S.mood<30) t.push('<span class="tag bad">😕 low mood</span>');
  if(d===gSat()&&!S.giveaway&&m<G_GIVE[1]) t.push('<span class="tag">🎒 giveaway at People’s 10–2</span>');
  if(d===gSchoolDay()&&!S.firstDay) t.push(`<span class="tag">🏫 first day · bell ${fmt(G_BELL)}</span>`);
  return t;
};

  if(S.loc!=='home'&&m>=gCurfew()-45&&m<gCurfew()) return {t:`🏠 Home by ${fmt(gCurfew())}. You’re ${travelMins(S.loc,'home')} minutes away.`};
  if(d===gSat()&&m<G_GIVE[1]&&!S.giveaway) return {t:'🎒 The back-to-school giveaway is at People’s today, 10 AM to 2 PM: free backpacks and supplies.',kind:'info'};

    const s=[];
    if(i===0) s.push('📦 moving-in day');
    if(i<5&&gCh1(i)) s.push('🎨 summer rec program 10–2 · 📬 school office 9–3');
    if(i===gSat()) s.push(`💵 allowance day · 🎒 giveaway 10–2${S.giveaway?' (went)':''} · 🍖 barbecue across the street${S.bbq?' (went)':''}`);
    if(i===6) s.push('☀️ the last day of summer');
    if(i>gSchoolDay()&&isSchoolDay(i)) s.push(`🏫 school at ${gSchoolShort()}`);
    if(i===gSchoolDay()) s.push(`🏫 first day of middle school, bell ${fmt(G_BELL)}`);
    if(S.curfew[i]) s.push('⏰ missed curfew');
    return `<div class="todo"><span class="ck">${i<d0?'✔️':i===d0?'👉':'·'}</span><div><b>${gDate(i)}</b><span>${s.join(' · ')||'a summer day'}</span></div></div>`}).join('')
    +`<div class="rules">Home by ${fmt(gCurfew())} every night, or Family drops.</div>`+lifeWeekList();
};
GROW.kidsView=()=>{
  const met=KIDS.filter(k=>gMet(k.id)),b=gBest();
  const hearts=f=>'❤️'.repeat(Math.min(5,Math.floor(f/4)))+'🤍'.repeat(5-Math.min(5,Math.floor(f/4)));
  return `<div class="sect">Friends · ${gFriends()}/100</div><div class="rules">You know ${met.length} of ${KIDS.length} kids. Say hi, hang out once a day, and any of them can become your best friend.${b?` Right now, your closest friend is <b>${b.n}</b>.`:''}</div>`
    +met.map(k=>`<div class="todo"><span class="ck">${k.ic}</span><div><b>${k.n} ${hearts(gF(k.id))}</b><span>${k.d} (met ${gDate(S.kids[k.id].met-1)})</span></div></div>`).join('')
    +(met.length<KIDS.length?`<div class="todo"><span class="ck">·</span><div><b>${KIDS.length-met.length} more to meet</b><span>Try the courts at People’s, MLK, the Reading Room, the overlook, the school and your own street.</span></div></div>`:'');
};
// ============================================================
//  TACOMPTON · GROWING UP, part 2: what happens. The welcome, the days and nights, curfew, events, tips, the to-do list,
//  the finale (the first day of middle school), achievements, the score, the start-page button and the end screen.
//  Chapter 1: Mon Aug 24 – Sun Aug 30, 2026, then the first day at Summit View Middle School on Mon Aug 31.
//  Friendship, family, curiosity and first-day nerves. The kids are 12: nothing else.
// ============================================================

// ---- lifecycle (04-loop.js calls these through the adult game's functions, which hand off here) ----
GROW.onNewGame=()=>{
  say(`${gLong(0)}, 2026, ${fmt(S.t)}. Your first morning on Hilltop. Boxes in the hall, your sister singing in the kitchen, and the Link bell ringing down on MLK.`);
  modal('🎒 Growing Up · Chapter 1',`<p>You’re <b>${S.age||12}</b>. Your family just moved into an apartment on <b>Hilltop</b>, in Tacoma: Mom, Dad, your little sister <b>Nia</b> (she’s ${7+(S.age||12)-12}) and you.</p>
    <p>🏫 In one week, on <b>${longDate(gSchoolDay())}</b>, you start ${gGradeWord()} grade at <b>${gSchool()}</b>, where you don’t know a single person. Yet.</p>
    <p>🎒 Get <b>Ready</b>: school supplies, the way to school, a haircut, your forms signed and turned in, and something to wear.</p>
    <p>🤝 Meet the kids on the hill. Any of them could become your best friend.</p>
    <p>🏠 Keep things good at home, and be home by <b>${fmt(gCurfew())}</b> every night.</p>${lifeLong()?`<p>🌱 <b>${LIFE_LEN[S.length].n}</b>: ${S.keyWeeks.length} key weeks, with a summary between them. Your birthday is ${S.birthday.label}.</p>`:''}
    <p>💵 You have <b>${$(Math.round(S.money))}</b> of allowance. Chores earn a little more.</p>`,[{l:'Go look out the window',fn:()=>{}}]);
};
const G_MORNING=['☀️ Warm already. The last week of summer and it knows it.','🌫️ A marine layer over the bay. It’ll burn off by ten.','🐦 The crows on the power line are holding a meeting. Loudly.','🎶 Somebody down the block is playing old Motown with the windows open.','🚋 The first Link of the day dings past on MLK.','🥞 Dad is making pancakes and singing about it.','🌤️ Haze from a fire somewhere over the Cascades. The sun comes up orange.'];
GROW.onMorning=d=>{
  if(d===0) return;
  const o=dateOf(d),late=o.m===8&&o.d>=20;   // the end-of-summer line only in late August
  say(`${gLong(d)}, ${fmt(S.t)}. ${d===gSchoolDay()?'🎒 Today is the day.':pick(late?G_MORNING:G_MORNING.slice(1))}`);
  if(d===gSat()){gEarn(10);say('💵 Saturday: allowance day. Dad leaves $10 on the counter under the salt shaker. The back-to-school giveaway is at People’s, 10 AM to 2 PM, and Tavita’s family across the street is firing up the grill tonight.')}
  else if(d===6) say('☀️ Sunday. The last day of summer. Church bells all over the hill, then a long, slow afternoon.');
  else if(d===gSchoolDay()) say(`🏫 The first day of ${gGradeWord()} grade at ${gSchool()}. The bell rings at ${fmt(G_BELL)}, and it’s ${travelMins('home','school')} minutes up the hill.`);
  else if(gWeekday(d)) say('🏥 Mom and Dad are at work until 5:30. You’re in charge of you (and the house key on a shoelace).');
};
GROW.onNight=(where,notes,d)=>{
  if(where==='collapsed'){S.loc='home';adj('mood',-4);notes.push('😵 You fell asleep in your clothes with the light on. Mom turned it off and put a blanket over you.')}
  const late=where!=='home'||tod()>=1350;
  if(late){S.late[d]=true;if(where==='home')notes.push('🌙 Up past 10:30. Tomorrow-you is not going to love this.')}
  if(!S.dinner[d]){adj('energy',-4);notes.push('🥣 You missed family dinner and ate cereal standing up.')}
  adj('energy',late?36:56);
  if(S.mood>70)adj('mood',-3);else if(S.mood<40)adj('mood',4);   // a night’s sleep evens things out a little
  if(S.curfew[d]) notes.push('⏰ You missed curfew tonight. Mom and Dad are not thrilled.');
  if(S.energy<20){adj('mood',-4);notes.push('🥱 You’re running on fumes.')}
  if(d===gSchoolDay()-1){S.alarm=405;notes.push(`⏰ Mom sets your alarm for ${fmt(405)}. “Big day.” ${gReady()>=100?'Your backpack is by the door, packed. You are ready.':`Ready: ${gReady()}%. It’ll have to do.`}`)}
  if(d===gSchoolDay()&&!S.firstDay) GROW.firstDayMissed(notes);
};
GROW.onTime=min=>{
  if(min>0) adj('energy',-min/55);
  if(!S||S.over||S.loc==='home'||tod()<gCurfew()) return;
  const d=day();
  if(!S.curfew[d]){S.curfew[d]=true;S.stats.curfew++;adj('family',-12);adj('mood',-3);
    say(`⏰ It’s ${fmt(S.t)} and you’re not home. Mom calls: “Where are you? Home. Now.” You run the whole way. Family −12.`)}
  S.loc='home';
};
GROW.onArrive=(dest)=>{
  S.visited[dest]=true;
  if(tod()>=gCurfew()&&dest!=='home'){S.loc='home';return}
  if(dest==='school'&&!S.ready.route){gGetReady('route');adj('mood',3);
    say(`🗺️ You found the way: up the hill, past the church and the corner with the blue house, ${travelMins('home','school')} minutes from your door. You’ll be able to do it Monday without thinking.`)}
};
GROW.daySummary=d=>[`⚡ ${S.energy}`,`🙂 ${S.mood}`,`🏠 ${S.family}`,`🤝 ${gFriends()}`,gCh1(d)?`🎒 ${gReady()}%`:`📚 ${gGrades()}`];   // Ready in the first week, Grades after
GROW.hudDay=d=>d===gSchoolDay()?`${gDate(d)} · First day of school`:`${gDate(d)} · Day ${d+1} of ${GAME.days}`;
GROW.checkLoss=()=>null;   // no game over in Chapter 1: a rough week still gets to Monday
const G_LOSSES={};

// ---- the special days ----
GROW.bbq=()=>{
  pass(90);S.bbq=true;const first=gFriend('tavita',gMet('tavita')?4:6);adj('family',6);adj('mood',8);adj('energy',8);
  say(`🍖 Two grills, three folding tables and a speaker playing everything from Earth, Wind & Fire to old island songs. ${first?'The kid with the ukulele introduces himself with a plate of food: <b>Tavita</b>. '+gKid('tavita').d+' ':'Tavita saves you the last spot at the kids’ table. '}Mom and Dad meet half the block. Ms. Lorraine from the porch on the corner tells Mom she has the best-looking plants on the street. Nia falls asleep in a lawn chair at eight. Family +6.`);
};
GROW.giveaway=()=>{
  pass(30);S.giveaway=true;adj('mood',4);
  const had=S.ready.supplies;gGetReady('supplies');if(had)adj('family',4);
  const k=KIDS.find(x=>!gMet(x.id)),first=k?gFriend(k.id,3):false;
  say(`🎒 Long tables in the gym: backpacks in every color, binders, pencils, glue sticks, and volunteers who say “Take what you need, baby.” ${had?'You already have supplies, so you pick out a purple backpack for Nia’s second grade. She will not take it off. Family +4.':'You leave with a backpack full of everything on the ${gGradeWord()}-grade list.'} ${first?`In line you meet <b>${k.n}</b>. ${k.d}`:''}`);
};

// ---- the finale: the first day of middle school ----
GROW.firstDayStart=()=>{
  const late=Math.max(0,tod()-G_BELL),R=S.ready,b=gBest(),walk=b&&S.ev.flags['bf_'+b.id]!=null?b:null;
  const met=KIDS.filter(k=>gMet(k.id)),others=met.filter(k=>!b||k.id!==b.id),names=a=>a.length<2?a.map(k=>k.n).join(''):a.slice(0,-1).map(k=>k.n).join(', ')+' and '+a[a.length-1].n;
  const P=(...l)=>l.filter(Boolean).map(t=>`<p>${t}</p>`).join('');
  const steps=[
    ['🏫 The front doors',P(late?`You get there at ${fmt(S.t)}. The halls are already quiet, and a hall monitor walks you to the office for a late pass.`:`You get there at ${fmt(S.t)}, with ${G_BELL-tod()} minutes to spare. Hundreds of kids on the steps, all talking at once.`,
      walk?`${walk.n} is waiting at the corner, like you planned. You walk the last block together, and the doors look smaller with two of you.`:met.length?`Halfway up the steps you hear your name. It’s ${pick(met).n}, waving.`:'You don’t know a single person here. Yet.',
      R.haircut?'Somebody you’ve never met says, “Nice cut.”':'',R.outfit?'Your outfit feels like you.':'You grabbed whatever was on top of the box this morning. It’s fine. Mostly.')],
    ['🚪 Homeroom, room 214',P(R.turnedIn?'Your name is on the list taped to the door. Locker 1142 opens on the first try, which feels like a sign.':R.signed?'Your forms are still in your backpack. The teacher sends you to the office to turn them in, and you miss the icebreaker game.':'Your name isn’t on the list yet. The office calls home, Mom sends the forms from work, and it’s all sorted by lunch.',
      R.supplies?'You have a binder, pencils and paper. The kid next to you doesn’t, so you lend a pencil. Instant ally.':'No binder, no pencil. The teacher hands you a spare pencil with a tired smile.')],
    ['🧭 Finding your classes',P(R.route&&S.ev.flags.map?'You know the 200 hall is upstairs, and your printed map is soft from a week in your back pocket. Science, math, PE: you’re never late.':R.route?'You know the building from the outside, at least. You only get turned around once, near the band room.':'You end up in the band room twice. The band teacher says you are welcome any time, just maybe not right now.')],
    ['🍎 Lunch',P(b?`${b.n} saved you a seat. ${others.length?`${names(others)} squeeze${others.length===1?'s':''} in too, and the table gets loud.`:'You split a bag of chips and plan the whole year.'}`:met.length?`You find ${names(met)} and sit together. Nobody eats alone.`:'You sit at the end of a long table. A kid slides a tray over: “You new? Me too.” It’s a start.')],
    ['🏠 The walk home',P(S.family>=70?'Mom made your favorite. Nia wants to hear everything, twice. Dad asks his question, “One good thing?”, and you have about nine.':S.family>=40?'Dinner is loud and happy. Nia shows you her purple-backpack day; you tell them about yours.':'It’s been a bumpy week at home, but tonight Mom asks how it went and really listens. That helps.',
      S.card?'Nia’s card is taped to your door: GOOD LUCK AT BIG SCHOOL, with an owl. It made it through the whole day.':'')],
  ];
  if(late)adj('mood',-4);
  const show=i=>{const [h,body]=steps[i],last=i===steps.length-1;
    modalSwap(`${h}`,`<p style="font-size:12px;color:var(--mute);margin:0 0 6px">The first day of ${gLevel()} · ${i+1} of ${steps.length}</p>${body}`,
      [last?{l:'📖 Finish Chapter 1',fn:()=>GROW.firstDayEnd({late:late>0,with:b?b.id:null,walk:!!walk})}:{l:`Next: ${steps[i+1][0]}`,stay:true,fn:()=>show(i+1)}],true)};
  pass(10);show(0);
};
GROW.firstDayEnd=r=>{
  S.firstDay=Object.assign({missed:false},r);adj('mood',r.late?2:8);
  S.loc='home';const t=S.cur*1440+1170;if(S.t<t)S.t=t;
  endDay('home');
};
GROW.firstDayMissed=notes=>{
  S.firstDay={late:true,missed:true,with:null,walk:false};
  notes.push(`🏫 You never made it up the hill this morning, so Mom drove you to ${gSchoolShort()} at 10:30 and walked you into the office. A late start, a long day, and you made it through anyway.`);
};

gEvent({id:'g_link_bell',hook:['arrive','linkwatch'],tile:['🔔','The Link bell','good'],chance:0.3,cooldown:1,cond:c=>c.hook==='linkwatch'||c.at==='mlk',

gEvent({id:'g_flyer',hook:'arrive',tile:['📄','A flyer on the door','info'],chance:0.5,max:1,cond:c=>['mlk','peoples','library'].includes(c.at)&&day()<gSat(),

gEvent({id:'g_zay_shortcut',hook:'arrive',tile:['🛹','A shortcut','good'],chance:0.7,max:1,cond:c=>c.at==='school'&&gMet('zay')&&!S.shortcut,

// ---- tips: one a day, each once per game ----
const G_TIPS=[

//  - The school calendar (SCH_TERMS): each school year has key dates. Middle school: the first day, the fall concert,

//    June, prom as a friends' night out (16+), a summer job (16+), and graduation week (the engine's 'graduation' week).
//    A term happens on its own day if you play it, or on the nearest played day of its window in that key week.
//  - The scheduler (LIFE_HOOKS.plan in 10-life.js): a kid's month / season / milestone key weeks move onto these dates

const SCH_OUT=885;          // 2:45 PM: the last bell

const schWx=()=>typeof wxOf==='function';
const schSnow=d=>!!SC().snow[d]||(schWx()&&d>gSchoolDay()&&schoolOn(dateOf(d))&&wxOf(d)==='snow');

// ---- the school calendar: school year Y starts in late summer of Y (day indices for a run starting on sd) ----
const SCH_CAL={};
function schCal(sd,Y){
  const key=sd+'|'+Y;if(SCH_CAL[key])return SCH_CAL[key];
  const ix=(y,m,d)=>dIdx(sd,y,m,d),dw=i=>dAt(sd,i).dow;
  const s1=ix(Y,9,1),first=s1-dw(s1);                                 // the Monday of the week of Sept 1
  let last=ix(Y+1,6,15);while(!schoolOn(dAt(sd,last)))last--;          // June 15, or the weekday before
  const n1=ix(Y,11,1),concert=n1+((3-dw(n1)+7)%7)+14;                 // the Thursday a week before Thanksgiving
  const d15=ix(Y,12,15),decMon=d15-dw(d15);                           // finals: the school week of Dec 15
  const m12=ix(Y+1,5,12),mayMon=m12-dw(m12);                          // testing: the school week of May 12
  const y1=ix(Y+1,5,1),prom=y1+((5-dw(y1)+7)%7)+14;                    // the third Saturday in May
  let junMon=last-dw(last);if(last-junMon<2)junMon-=7;                 // June finals: the last week or so of school
  const su=ix(Y+1,6,16),sumMon=su+((7-dw(su))%7);                     // summer: from June 16
  return SCH_CAL[key]={Y,first,last,concert,decMon,winter:[ix(Y,12,20),ix(Y+1,1,2)],mayMon,prom,junMon,summer:[su,ix(Y+1,8,31)],sumMon};
}
const schY=d=>{const o=dateOf(d);return o.m>=7?o.y:o.y-1};
// type: 'school' happens at school (when you go in), 'evening' is an action at home, 'plan' is a choice in the morning.

const SCH_TERMS=[

  {id:'finalsDec',type:'plan',st:'high',key:true,win:c=>[c.decMon,c.decMon+4],pref:c=>c.decMon,n:'Finals week',ic:'📝'},

const ghWage=()=>{const y=dateOf(day()).y;return y<=2026?17.13:y===2027?17.73:Math.round(17.73*Math.pow(1.03,y-2027)*100)/100};   // Washington's minimum wage (L&I): $17.13 in 2026, $17.73 in 2027; 16- and 17-year-olds get the full rate
const ghJob=()=>{const g=ghS();return g.job?GH_JOBS[g.job.id]:null};
function ghShift(d=day()){const g=ghS(),J=ghJob();if(!J||d<g.job.since)return null;return J.shifts[((d%7)+7)%7]||null}
const ghDays=J=>Object.keys(J.shifts).map(k=>DAYS[k].slice(0,3)).join(', ');
function ghApply(J){
  modal(`${J.ic} A job at ${J.n}`,`<p>${J.pitch}</p><p>🗓️ <b>${J.when}</b>. Pay: <b>${$(ghWage())} an hour</b>, Washington’s minimum wage, and it goes straight into your Money.</p>
    <p>📝 Mom and Dad sign the parent/school authorization form (Washington wants one for every worker under 18), and you start tomorrow. Miss three shifts and they’ll find somebody else.</p>`,[
    {l:'✅ Take the job',s:`Shifts start tomorrow.`,fn:()=>{const g=ghS();g.job={id:J.id,since:day()+1,hired:day()};g.miss=0;adj('mood',6);adj('family',3);
      lifeMoment(J.ic,`First job: ${J.role} at ${J.n}.`);say(`${J.ic} You’re hired: ${J.role} at ${J.n}. Dad frames the offer email. Not literally. He prints it and puts it on the fridge. Mood +6.`)}},
    {l:'Not right now',fn:()=>{}}]);
}
function ghJobActs(loc,d,m){
  const a=[],g=ghS(),mine=ghJob();
  for(const J of Object.values(GH_JOBS)){if(J.at!==loc)continue;
    if(mine&&mine.id===J.id){
      const sh=ghShift(d),done=d in g.worked,wage=ghWage();
      if(sh&&!done&&m<sh[1]-60){const late=Math.max(0,m-sh[0]);
        a.push({ic:J.ic,l:`Work your shift (${fmt(sh[0])}–${fmt(sh[1])})`,s:m<sh[0]?`Starts in ${sh[0]-m} min: you wait in the back. ${$(wage)}/hr.`:late<=5?`On time. ${$(wage)}/hr, energy −${Math.round((sh[1]-m)/30)}.`:`You’re ${late} min late. Go in now.`,cat:'work',cls:'primary',
          fn:()=>{if(tod()<sh[0])pass(sh[0]-tod());const st=tod(),lt=Math.max(0,st-sh[0]-5),mins=sh[1]-st,pay=Math.round(mins/60*wage);pass(mins);
            g.worked[d]=lt;g.shifts++;g.paid+=pay;gEarn(pay);adj('energy',-Math.round(mins/30));adj('mood',2);
            say(`${pick(J.work)} You earn <b>${$(pay)}</b> for ${Math.round(mins/6)/10} hours${lt?`, and the ${lt} minutes late get a look. A nice look, but a look`:''}.`)}});
      }else if(sh&&done) a.push({ic:'✔️',l:'Shift done',s:`Next: ${ghDays(J)}.`,cat:'work',dis:true,fn:()=>{}});
      a.push({ic:'👋',l:`Give your notice at ${J.n}`,s:`You work ${J.when}. ${g.shifts} shift${g.shifts===1?'':'s'} so far, ${$(g.paid)} earned.`,cat:'work',fn:()=>{g.job=null;say(`${J.ic} You give your notice. The crew signs a card. You can come back any time, they say, and they mean it.`)}});
    }else if(ghAge()>=16&&!mine){
      a.push({ic:'💼',l:`Ask about the part-time job at ${J.n}`,s:`There’s a “Now hiring: 16+” sign. ${J.when}.`,cat:'work',fn:()=>{pass(15);ghApply(J)}});
    }else if(ghAge()<16) a.push({ic:'💼',l:`“Now hiring: 16+”`,s:`A sign in the window at ${J.n}. ${ghAge()===15?'Next year.':'Someday.'}`,cat:'work',dis:true,fn:()=>{}});
  }
  return a;
}

function ghPal(){const met=KIDS.filter(k=>gMet(k.id)).sort((a,b)=>gF(b.id)-gF(a.id));return met.length?met[Math.floor(Math.random()*Math.min(2,met.length))]:null}
function A(o){

  const fx=[o.e?`energy ${sg(o.e)}`:'',o.mo?`mood ${sg(o.mo)}`:'',o.fa?`family ${sg(o.fa)}`:'',o.gr?`grades ${sg(o.gr)}`:'',o.fr&&gMetCount()?'a friend comes along':''].filter(Boolean).join(', ');
  return {ic:o.ic,l:o.l+(c?` — ${$(c)}`:''),cat:o.cat||'fun',cls:o.cls||'',dis:!open||done||!ok,
    s:!open?o.closed:done?'Done for today.':!ok?`You have ${$(Math.round(S.money))}.`:`${o.mins} min.${fx?` ${cap(fx)}.`:''}${o.k?' Once a day.':''}`,
    fn:()=>{if(c)gSpend(c);if(key)g.done[key]=true;const p=o.fr?ghPal():null;pass(o.mins);
      if(o.e)adj('energy',o.e);if(o.mo)adj('mood',o.mo);if(o.fa)adj('family',o.fa);if(o.gr)S.grades=clamp(gGrades()+o.gr,0,100);if(p)gFriend(p.id,o.fr);
      const t=typeof o.txt==='function'?o.txt():pick(o.txt);say((p?`${p.ic} ${p.n} meets you there. `:'')+t)}};
}

// ---------------- "📲 Install app" on the title screen, and the install bar above it ----------------
// 08-settings.js puts installButton() right under ❓ Help on the title screen, and installBar() at the very top: a slim
// "📲 Play offline: install the app [Install] [✕]" line for phones and tablets in a browser (and any browser that has offered an
// install). ✕ hides the bar for 30 days. The Install app button is always there, except in the single-file offline build
// (SINGLE_FILE: no server, nothing to install). What it does depends on the device:
//   Chrome / Edge / Samsung Internet (Android and computers): when the browser has offered an install (beforeinstallprompt),
//     the button opens the browser's own install prompt; after appinstalled it says thanks.
//   No offer (Firefox, a browser that hasn't decided the page is installable, already installed, …): a short sheet with the menu steps.
//   iPhone / iPad (incl. iPadOS that reports as a Mac with touch): the step-by-step page install/ios.html, with a video.
//   Already running as the installed app: a short note saying so.
let deferredInstall=null;
const INSTALLED_KEY=KEY('installed');   // set after appinstalled: a browser tab of an installed app shows no button
const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true}catch(e){return false}};
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const SINGLE_FILE=true;   // tools/build-offline.py turns this on in the one-file offline copy
const canInstallHere=()=>!SINGLE_FILE&&/^https?:$/.test(location.protocol)&&!isStandalone();
function installShown(){
  if(!canInstallHere())return false;
  if(deferredInstall||isIOS())return true;
  try{return localStorage.getItem(INSTALLED_KEY)!=='1'}catch(e){return true}
}
const installVisible=()=>!SINGLE_FILE;
function installButton(){if(!installVisible())return '';
  const sub=isStandalone()?'You’re playing the installed app':'Put it on your home screen. Plays offline.';
  return `<button id="installBtn" class="t-btn t-inst" onclick="doInstall()"><span class="t-ic" aria-hidden="true">📲</span><span class="t-tx"><b>Install app</b><span>${sub}</span></span></button>`}
const isPhoneOrTablet=()=>isIOS()||/android|mobi|silk|kindle|tablet/i.test(navigator.userAgent)||!!(navigator.userAgentData&&navigator.userAgentData.mobile);
const BAR_KEY=KEY('installBarHidden'),BAR_DAYS=30;   // when ✕ was tapped (ms)
function installBarDismissed(){try{const t=+localStorage.getItem(BAR_KEY);return t>0&&Date.now()-t<BAR_DAYS*864e5}catch(e){return false}}
function installBarShown(){return installShown()&&(isPhoneOrTablet()||!!deferredInstall)&&!installBarDismissed()}
function installBar(){return installBarShown()?`<div class="inst-bar" id="installBar" role="region" aria-label="Install the app"><span class="ib-t">📲 Play offline: install the app</span>
  <button id="installBarBtn" class="ib-go" onclick="doInstall()">Install</button><button class="ib-x" onclick="dismissInstallBar()" aria-label="Dismiss">✕</button></div>`:''}
window.dismissInstallBar=()=>{try{localStorage.setItem(BAR_KEY,String(Date.now()))}catch(e){}
  const b=document.getElementById('installBar');if(b)b.remove();
  const f=document.querySelector('.title .big');if(f)f.focus();
  if(typeof fitTitle==='function')fitTitle()};
function syncInstallBtn(){const bar=document.getElementById('installBar');
  if(bar&&!installBarShown()){bar.remove();if(typeof fitTitle==='function')fitTitle()}
  else if(document.querySelector('.title')&&!bar&&installBarShown())titleScreen()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;try{localStorage.removeItem(INSTALLED_KEY)}catch(x){}syncInstallBtn()});
window.addEventListener('appinstalled',()=>{deferredInstall=null;try{localStorage.setItem(INSTALLED_KEY,'1')}catch(e){}syncInstallBtn();
  installToast('✅ Thanks for installing Tacompton! Find it on your home screen. It plays offline, too.')});
// A short note at the bottom of the screen (the title screen has no event tiles).
function installToast(msg){
  document.querySelectorAll('.inst-toast').forEach(e=>e.remove());
  const el=document.createElement('div');el.className='inst-toast';el.setAttribute('role','status');el.setAttribute('aria-live','polite');el.textContent=msg;
  document.body.appendChild(el);setTimeout(()=>el.remove(),6000);
}
// The other browsers' menu steps, by what this browser looks like.
function installSteps(){
  const ua=navigator.userAgent,mobile=/android|mobile/i.test(ua);
  if(/SamsungBrowser/i.test(ua))return ['Tap the menu button (☰) at the bottom of the screen.','Tap <b>Add page to</b>, then <b>Home screen</b>.','Tap <b>Add</b>. Tacompton is now on your home screen.'];
  if(/Firefox|FxiOS/i.test(ua)&&mobile)return ['Tap the browser menu (⋮).','Tap <b>Add app to Home screen</b> (or <b>Install</b>).','Tap <b>Add</b>. Tacompton is now on your home screen.'];
  if(/Firefox/i.test(ua))return ['Firefox on a computer can’t install web apps. Open this page in Chrome or Edge to install it.','Or simply bookmark it: once loaded, the game also plays offline in this browser.'];
  if(!mobile&&/Safari/i.test(ua)&&!/Chrome|Chromium|Edg/i.test(ua))return ['In Safari’s menu bar, choose <b>File → Add to Dock…</b> (macOS Sonoma or later).','Click <b>Add</b>. Tacompton opens from the Dock in its own window.'];
  if(!mobile)return ['Click the install icon (a screen with a down arrow) at the right end of the address bar,','or open the browser menu (⋮ or …) and choose <b>Install Tacompton</b> (Edge: <b>Apps → Install this site as an app</b>).','Click <b>Install</b>. Tacompton gets its own window and a desktop icon.'];
  return ['Open the browser menu (⋮), at the top right.','Tap <b>Install app</b> or <b>Add to Home screen</b>.','Tap <b>Install</b> (or <b>Add</b>). Tacompton is now on your home screen.'];
}
function installSheet(){
  const steps=installSteps();
  modal('📲 Install Tacompton',`<p>Put the game on your home screen: it opens full screen, like an app, and plays offline.</p>
  <ol class="inst-steps">${steps.map(s=>`<li>${s}</li>`).join('')}</ol>
  <p style="font-size:13px;color:var(--mute)">Don’t see it in the menu? Use the game for a minute and look again: some browsers only offer it after a short visit. On Android and computers the installed app keeps this browser’s saved games.</p>`,
  [{l:'Got it',fn:()=>{}}]);
}
window.doInstall=async()=>{
  if(deferredInstall){const ev=deferredInstall;deferredInstall=null;
    try{ev.prompt();const c=await ev.userChoice;if(c&&c.outcome==='accepted'){try{localStorage.setItem(INSTALLED_KEY,'1')}catch(e){}}}catch(e){}
    syncInstallBtn();return}
  if(isStandalone()){installToast('✅ You’re already playing the installed app. Find Tacompton on your home screen any time.');return}
  if(isIOS()){if(typeof saveGame==='function'&&S&&!S.over)saveGame();location.href='install/ios.html';return}
  installSheet();
};
// ---------------- boot ----------------
applyPrefs();
titleScreen();
